<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Symbio logo">
  <title>Symbio</title>
  <desc>两枚交叠编织的圆环（靛蓝与青绿），交叠中心一个白色节点，象征人机共生与多智能体协作</desc>
  <defs>
    <linearGradient id="sym-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="sym-ring-indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="sym-ring-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- 应用图标底板：深靛夜空 -->
  <rect width="512" height="512" rx="112" fill="url(#sym-bg)"/>

  <!-- 双环：靛蓝（模型/认知） × 青绿（工具/行动） -->
  <circle cx="204" cy="256" r="92" fill="none" stroke="url(#sym-ring-indigo)" stroke-width="38"/>
  <circle cx="308" cy="256" r="92" fill="none" stroke="url(#sym-ring-teal)" stroke-width="38"/>

  <!-- 编织：上交叉靛蓝在上，下交叉青绿在上 -->
  <path d="M 227.8 167.1 A 92 92 0 0 1 278.4 201.9"
        fill="none" stroke="url(#sym-ring-indigo)" stroke-width="38" stroke-linecap="round"/>
  <path d="M 284.2 344.9 A 92 92 0 0 1 233.6 310.1"
        fill="none" stroke="url(#sym-ring-teal)" stroke-width="38" stroke-linecap="round"/>

  <!-- 交点：共生核心 -->
  <circle cx="256" cy="256" r="26" fill="#ffffff"/>
</svg>
