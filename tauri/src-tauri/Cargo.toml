[package]
name = "symbio-tauri"
version = "0.1.13"
description = "A Tauri application with fractal plugin system"
authors = ["Symbio Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
symbio = { path = "../../symbio" }
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Force time crate version to fix macOS compilation issue
time = "0.3.47"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = false
opt-level = 0

[profile.release]
opt-level = "s"
[profile.release.package."*"]
codegen-units = 1
