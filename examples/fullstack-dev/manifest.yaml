# Agent 目录清单 —— 全栈开发智能体（agent-dir/v2）
#
# 本目录是一个**自包含的 Agent 目录**：无论从哪装配，内部结构都一样——
#   - 作为系统根：宿主直接用它装配（system Agent）
#   - 作为子 Agent：放到 <系统根>/agent/<id>/ 下，由 agent 插件托管
# 这两种形态下目录内容完全相同（agent-dir/v2 §1.1 的「同构」），
# 区别只在「谁托管」与「挂载多少插件」。这是分形结构，不是两种格式。
#
# 规范：docs/003-design/011-Agent目录规范.md
# 能力插件无需在本清单登记：mcp/ skill/ 目录里「存在即安装」（§4.1）。
spec: "agent-dir/v2"
id: "com.symbio.fullstack-dev"
name: "全栈开发智能体"
version: "2.0.0"
description: "按 agent-dir/v2 装配的全栈开发 Agent：需求澄清→架构决策→分层实现→前后端集成→测试交付"
authors:
  - "symbio"
# 接入门槛（§10）：要求宿主支持 agent-dir 主版本 2，否则拒绝接入
requires:
  spec: "^2"
# 权限（§5.3）：语义是**授权清单**（grant）——列了才能用，空清单即拒。
# 管辖范围只有**这个包自己**（glob 相对 Agent 目录根）：智能体在用户工作目录里
# 读写项目文件不归它管（那是宿主工作区闸与审批的地界），别人的包也不归它管。
permissions:
  network:
    # 出站域名白名单（标签边界匹配：`*.github.com` 命中裸域名与任一子域）。
    # 全栈开发要查文档 / 查依赖信息，站点无法枚举 ⇒ 显式给全量；
    # 收紧时把具体域名列进来，留空 = 一次出站都不许（fail-closed）。
    domains: ["*"]
  fs:
    # 自己的包整个可读：人格 / 技能 / 清单都在里面
    read: ["**"]
    # 可写的只有自己的记忆：`memory/**` 是子树 memory 挂载点的虚拟地址
    # （模型经 vdfs 改人格走这条），`AGENTS.md` 是同一文件的物理形态。
    # 技能**不给**写：技能由人安装（导入即安装），智能体自改技能 = 自改能力面。
    write: ["memory/**", "AGENTS.md"]
  limits:
    # 人格文件字节上限（超出 ⇒ 装载期拒载，不是运行时截断）
    max_prompt_bytes: 65536
    # 本 Agent 贡献的工具数上限（超出 ⇒ 整轮拒载）
    max_tools: 32
