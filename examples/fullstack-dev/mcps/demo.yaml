# MCP server 声明（规范 §5.3）—— OAB 中**工具唯一来源**
#
# 这是行业标准的 MCP server 配置对象，原样透传给宿主已有的 MCP 客户端：
# OAB 不重新发明工具运行时，也不定义 oab.echo 之类的宿主专有执行器。
#
# 支持两种形态：
#   1. 文件形态：mcps/<name>.yaml | .yml | .json
#   2. 目录形态：mcps/<name>/config.yaml（或 server.yaml / mcp.json 等）
#
# 常用字段（stdio 传输）：
#   command / args / env   启动命令
#   transport: http        （可选）改用 http 传输时配合 url / headers
#
# 下面的 demo server 仅作格式示例；宿主尚未桥接 MCP 客户端时会记一条告警并跳过
# （诚实缺位，不静默吞掉）。如不需要 MCP 工具，删掉本文件即可。
command: npx
args:
  - "-y"
  - "@modelcontextprotocol/server-everything"
