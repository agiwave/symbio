name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        type: boolean
        default: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  RUSTUP_MAX_RETRIES: 10

permissions:
  contents: write
  packages: write

# 桌面交付物 = Tauri 原生窗口壳（symbio-desktop）+ CLI 后端（symbio-cli）。
# desktop 窗口加载本机 CLI serve 的地址；前端由 packages/ui 构建一次、由 CLI 的
# build.rs 编译期内嵌进二进制。前端走 HTTP/WS、没有 IPC command，但原生窗口本身
# 仍需系统 WebView：Linux 要 WebKitGTK/GTK，Windows 要 WebView2（Win11 自带）。

jobs:
  # 代码质量预检（防御性）
  # 日常开发由 ci.yml 拦截；此处防止有人用 workflow_dispatch 跳过 ci 直接出包
  quality-gate:
    name: Quality Gate (pre-flight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-gate-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux system libs (OpenSSL + WebView)
        # HTTP 出口的 TLS 走系统 OpenSSL（D-013）；desktop 是 Tauri 原生窗口壳，
        # tao + wry 在 Linux 需要 WebKitGTK / GTK3 / appindicator / rsvg 头文件。
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        working-directory: packages/ui
        run: npm ci

      - name: Backend gate
        # 与日常 ci.yml 同一条命令（fmt + workspace 测试 + clippy + session 台账）。
        # CLI 的 build.rs 在编译期内嵌 packages/ui/dist，前端产物已在下面的 gate 中构建。
        run: node scripts/gate.mjs --preset=frontend --ci && node scripts/gate.mjs --preset=rust --ci

      - name: Docs, facts & baseline gate
        # 静态审计 + 事实表复核 + 基线变更审。tag 上没有 PR base 时，
        # baseline-scope 按「判不了」诚实跳过，不假绿。
        run: node scripts/gate.mjs --preset=docs-facts --ci

  # 检查版本一致性
  check-version:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.create_release && github.sha || '0.0.0' }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify version matches
        run: |
          TAG_VERSION=${{ steps.get_version.outputs.version }}
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [[ "$TAG_VERSION" != "$CARGO_VERSION" && "$TAG_VERSION" != "0.0.0" ]]; then
            echo "::warning::版本不一致: tag=$TAG_VERSION, cargo=$CARGO_VERSION"
          fi

  # Windows 构建
  build-windows:
    name: Build Windows
    needs: [check-version, quality-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Install dependencies
        working-directory: packages/ui
        run: npm ci

      - name: Build frontend
        working-directory: packages/ui
        run: npm run build

      - name: Build CLI and desktop launcher
        run: cargo build --release -p symbio-cli -p symbio-desktop

      - name: Create portable ZIP
        shell: pwsh
        run: |
          # 两个二进制同目录：启动器按同目录查找 CLI，无需额外配置。
          New-Item -ItemType Directory -Path portable-app -Force | Out-Null
          Copy-Item "target/release/symbio-cli.exe" -Destination "portable-app/"
          Copy-Item "target/release/symbio-desktop.exe" -Destination "portable-app/"
          Copy-Item "target/release/*.dll" -Destination "portable-app/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "portable-app\*" -DestinationPath "symbio-portable-windows-x64.zip" -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: symbio-portable-windows-x64.zip
          if-no-files-found: error

  # macOS 构建 - 支持多架构
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: [check-version, quality-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-latest
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: packages/ui
        run: npm ci

      - name: Build frontend
        working-directory: packages/ui
        run: npm run build

      - name: Build CLI and desktop launcher
        run: cargo build --release --target ${{ matrix.target }} -p symbio-cli -p symbio-desktop

      - name: Create portable archive
        run: |
          mkdir -p portable-app
          cp "target/${{ matrix.target }}/release/symbio-cli" portable-app/
          cp "target/${{ matrix.target }}/release/symbio-desktop" portable-app/
          tar -czf "symbio-portable-macos-${{ matrix.arch }}.tar.gz" -C portable-app .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: symbio-portable-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # Linux 构建
  build-linux:
    name: Build Linux
    needs: [check-version, quality-gate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Install Linux dependencies
        # TLS 走系统 OpenSSL；desktop 原生窗口壳需要 WebKitGTK/GTK3 前置。
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        working-directory: packages/ui
        run: npm ci

      - name: Build frontend
        working-directory: packages/ui
        run: npm run build

      - name: Build CLI and desktop launcher
        run: cargo build --release -p symbio-cli -p symbio-desktop

      - name: Create portable archive
        run: |
          mkdir -p portable-app
          cp target/release/symbio-cli portable-app/
          cp target/release/symbio-desktop portable-app/
          tar -czf symbio-portable-linux-x64.tar.gz -C portable-app .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: symbio-portable-linux-x64.tar.gz
          if-no-files-found: error

  # 创建 Release
  create-release:
    name: Create GitHub Release
    needs: [check-version, quality-gate, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts/ -type f

      - name: Prepare release notes
        id: release_notes
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "## 更新内容" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md 2>/dev/null || \
          git log -10 --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md

          echo "" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 下载" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "每个压缩包内含两个二进制：\`symbio-cli\`（后端 + 内嵌 UI）与 \`symbio-desktop\`（Tauri 原生窗口）。" >> RELEASE_NOTES.md
          echo "运行 \`symbio-desktop\` 打开原生桌面窗口（窗口加载本机 CLI serve 的 UI）；也可直接运行 \`symbio-cli serve --browser\` 用浏览器访问。" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "- **Windows x64**: symbio-portable-windows-x64.zip" >> RELEASE_NOTES.md
          echo "- **macOS Intel**: symbio-portable-macos-x86_64.tar.gz" >> RELEASE_NOTES.md
          echo "- **macOS Apple Silicon**: symbio-portable-macos-aarch64.tar.gz" >> RELEASE_NOTES.md
          echo "- **Linux x64**: symbio-portable-linux-x64.tar.gz" >> RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: "Symbio v${{ needs.check-version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false
          files: |
            artifacts/windows-x64-portable/*.zip
            artifacts/macos-x86_64/*.tar.gz
            artifacts/macos-aarch64/*.tar.gz
            artifacts/linux-binaries/*.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
