name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        type: boolean
        default: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  RUSTUP_MAX_RETRIES: 10

permissions:
  contents: write
  packages: write

jobs:
  # 代码质量预检（防御性）
  # 日常开发由 ci.yml 拦截；此处防止有人用 workflow_dispatch 跳过 ci 直接出包
  quality-gate:
    name: Quality Gate (pre-flight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-gate-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: symbio

      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: symbio

      - name: Run tests
        run: cargo test --workspace
        working-directory: symbio

      - name: Run project audit
        # S-002 异步锁 / S-007 CHANGELOG / I-014 硬编码等审计
        run: bash scripts/grep_audit.sh

  # 检查版本一致性
  check-version:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.create_release && github.sha || '0.0.0' }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Verify version matches
        run: |
          TAG_VERSION=${{ steps.get_version.outputs.version }}
          CARGO_VERSION=$(grep '^version = ' tauri/src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [[ "$TAG_VERSION" != "$CARGO_VERSION" && "$TAG_VERSION" != "0.0.0" ]]; then
            echo "::warning::版本不一致: tag=$TAG_VERSION, cargo=$CARGO_VERSION"
          fi

  # Windows 构建
  build-windows:
    name: Build Windows
    needs: [check-version, quality-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Webview2
        run: |
          $WebView2InstallPath = "$env:ProgramFiles\Microsoft\EdgeWebView\Application\msedgewebviewinstaller.exe"
          if (!(Test-Path $WebView2InstallPath)) {
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
            & "$env:TEMP\MicrosoftEdgeWebview2Setup.exe" /silent /install
          }

      - name: Install dependencies
        working-directory: tauri
        run: npm ci

      - name: Build frontend
        working-directory: tauri
        run: npm run build

      - name: Build Tauri app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          appSrcPath: tauri
          args: --bundles nsis

      - name: Build Tauri app (portable ZIP)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          appSrcPath: tauri
          args: --bundles msi

      - name: Create portable ZIP
        run: |
          # 复制编译好的可执行文件到单独目录
          mkdir portable-app
          Copy-Item "tauri/src-tauri/target/release/symbio-tauri.exe" -Destination "portable-app/"
          Copy-Item "tauri/src-tauri/target/release/*.dll" -Destination "portable-app/" -ErrorAction SilentlyContinue

          # 创建压缩包
          Compress-Archive -Path "portable-app\*" -DestinationPath "symbio-portable-windows-x64.zip" -Force

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: |
            tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: |
            symbio-portable-windows-x64.zip
          if-no-files-found: warn

  # macOS 构建 - 支持多架构
  # 注意：GitHub 正在弃用 Intel macOS runner，因此使用交叉编译
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: [check-version, quality-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-latest
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: tauri
        run: npm ci

      - name: Build frontend
        working-directory: tauri
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          appSrcPath: tauri
          args: --target ${{ matrix.target }} --bundles dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # Linux 构建
  build-linux:
    name: Build Linux
    needs: [check-version, quality-gate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2 \
            desktop-file-utils \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev

      - name: Install dependencies
        working-directory: tauri
        run: npm ci

      - name: Build frontend
        working-directory: tauri
        run: npm run build

      - name: Build Tauri app (deb only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          appSrcPath: tauri
          args: --bundles deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            tauri/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  # 创建 Release
  create-release:
    name: Create GitHub Release
    needs: [check-version, quality-gate, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Artifacts structure ==="
          find artifacts/ -type f
          echo "========================="

      - name: Prepare release files list
        id: get_files
        run: |
          # 找到所有要上传的文件
          FILES=""
          for f in artifacts/windows-x64-installer/*.exe artifacts/windows-x64-portable/*.zip artifacts/macos-x86_64/*.dmg artifacts/macos-aarch64/*.dmg artifacts/linux-binaries/*.deb; do
            if [ -f "$f" ]; then
              FILES="$FILES $f"
              echo "Found: $f"
            fi
          done
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Prepare release notes
        id: release_notes
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 生成更新日志
          echo "## 更新内容" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md 2>/dev/null || \
          git log -10 --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md

          echo "" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 下载" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Windows" >> RELEASE_NOTES.md
          echo "- **x64 安装包**: Windows x64 NSIS 安装包（推荐）" >> RELEASE_NOTES.md
          echo "- **x64 绿色版**: Windows x64 便携版（ZIP 压缩包，无需安装）" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### macOS" >> RELEASE_NOTES.md
          echo "- **x64 (Intel)**: macOS Intel (x86_64) DMG - 适用于 Intel 芯片 Mac" >> RELEASE_NOTES.md
          echo "- **ARM64 (Apple Silicon)**: macOS Apple Silicon (M1/M2/M3) DMG - 适用于 Apple 芯片 Mac" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Linux" >> RELEASE_NOTES.md
          echo "- **x64**: Linux x64 DEB 包" >> RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: "Symbio v${{ needs.check-version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false
          files: |
            artifacts/windows-x64-installer/*.exe
            artifacts/windows-x64-portable/*.zip
            artifacts/macos-x86_64/*.dmg
            artifacts/macos-aarch64/*.dmg
            artifacts/linux-binaries/*.deb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
