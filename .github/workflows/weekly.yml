name: Weekly audits

# 周档判据的慢车道（DE-016 ）——与 ci.yml 同一个门禁脚本、同一个门禁本体，
# 只换触发频率：`@gate weekly` 桶（style / test-layout / eol / slo-exit 这一类
# 风格性 / 布局性 / 低频漂移判据）每周核一次，提交门禁不必每轮都为它们买单。
#
# ⚠️ **schedule 只在默认分支（main）上生效**——GitHub 的已知约束，对本仓库意味着
# `v2` 上的周档判据在此处不会自动触发，靠两种方式补位：
#   1. 本地全量门禁跑全阶段（`weekly` 阶段在全量跑里），活跃开发不欠账；
#   2. 本 job 支持手动触发（`workflow_dispatch`），v2 合并前可随时指定分支跑一次。
# 这与 ci.yml 头部那条「漏跑的代价远大于多跑」是同一课的第四次出现：第一次漏文件类型、
# 第二次漏分支名单、第三次漏改名，这次是平台行为本身——所以写在这里，而不是等着被发现。
#
# 判据条数只增不减：退役周档判据必须同批下调 `scripts/gate.d/62-weekly.mjs` 的
# `MIN_WEEKLY` 并在退役提交里写明理由（ratchet，不是可按的开关）。
on:
  schedule:
    # 每周一 03:00 UTC。只挑低负载时段，无其他含义。
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  weekly-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 全量历史：`eol-audit` 等按 git blob 对账，浅克隆会让它走「读不出 ⇒ 判红」。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Weekly audits gate
        # 与本地同一条命令。只跑 weekly 阶段（`@gate weekly` 桶，带 --strict）；
        # 判据清单在脚本头声明里（此处不重抄，抄了会漂移）。
        run: node scripts/gate.mjs --preset=weekly --ci

  # 跨平台 Rust 门禁：日常 ci.yml 只在 ubuntu 上跑 workspace 测试，Windows /
  # macOS 的编译差异（cfg、路径分隔符、平台 TLS、Tauri 平台前置）只有发布时才
  # 第一次暴露。放在周档而不是每次提交：平台漂移不随单次提交变化，每周一次足以
  # 在累积成发布阻塞前抓住（与  的分频纪律同源）。
  platform-rust:
    name: Rust gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: packages/ui
        run: npm ci

      - name: Build frontend assets
        # `tauri::generate_context!` 在编译期读 `frontendDist: ../dist`；
        # 缺产物时 workspace 的 cargo test / clippy 会在 proc macro 处全红。
        working-directory: packages/ui
        run: npm run build

      - name: Rust gate
        # 与 ci.yml 的 rust-checks 同一条命令；检查项只在 gate.mjs 里定义一处。
        run: node scripts/gate.mjs --preset=rust --ci
