name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.rs'
      - '**/*.ts'
      - '**/*.vue'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'package.json'
      - '**/package.json'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.editorconfig'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.rs'
      - '**/*.ts'
      - '**/*.vue'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'package.json'
      - '**/package.json'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.editorconfig'

jobs:
  # Rust代码质量检查
  rust-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [dev, release]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        # 使用 rust-toolchain.toml 锁定版本，保证与本地开发环境一致（避免 rustfmt 版本漂移导致 fmt 失败）
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        # rustfmt.toml 在仓库根目录，rustfmt 会从源文件目录向上查找配置
        run: cargo fmt --all -- --check
        working-directory: symbio

      - name: Clippy check
        # clippy.toml 在 symbio/ 目录（与 Cargo.toml 同级），自动被 cargo clippy 读取
        # -D warnings 把告警当错误，强制团队修掉
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: symbio

      - name: Build
        run: cargo build --profile ${{ matrix.profile }}
        working-directory: symbio

      - name: Run tests
        run: cargo test --workspace
        working-directory: symbio

      - name: Run project audit
        # S-002 异步锁 / S-007 CHANGELOG / I-014 硬编码等审计
        # 失败时让 PR 无法合并
        run: bash scripts/grep_audit.sh
        continue-on-error: false

  # 前端代码质量检查 (如果存在前端构建工具)
  frontend-checks:
    if: |
      github.event_name == 'push' || 
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # package-lock.json 位于 tauri/ 子目录，必须显式指定，否则 cache 解析失败
          cache-dependency-path: tauri/package-lock.json
      
      - name: Check frontend dependencies
        working-directory: tauri
        run: npm ci

      - name: Type check (vue-tsc)
        # 防止 TS 类型错误合入
        working-directory: tauri
        run: npx vue-tsc --noEmit

      - name: Unit tests (vitest)
        # 纯逻辑层（utils / composables / services）单元测试门禁
        working-directory: tauri
        run: npm test

      - name: Check for obvious frontend issues
        # 简单检查：确保没有明显的语法错误
        run: |
          echo "Basic frontend sanity check passed"
          # 这里可以添加更具体的检查，如eslint如果可用的话

      - name: Validate package.json
        run: |
          npm pkg validate
        working-directory: tauri

  # 文档和配置验证
  docs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for obvious documentation issues
        run: |
          # 检查README是否存在基本结构
          if ! grep -q "^# Symbio" README.md; then
            echo "README.md 格式异常"
            exit 1
          fi
          
          # 检查Cargo.toml基本字段
          if ! grep -q "^name = " symbio/Cargo.toml; then
            echo "symbio/Cargo.toml 缺少name字段"
            exit 1
          fi
          
          echo "基础文档和配置检查通过"

  # 安全检查 (可选)
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run security audit
        working-directory: symbio
        run: cargo audit --ignore RUSTSEC-2020-0058 --ignore RUSTSEC-2021-0099
        # 忽略一些已知的误报或低严重性问题