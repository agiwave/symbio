name: CI

# ⚠️ **用黑名单（`paths-ignore`）而不是白名单（`paths`）** —— 2026-09-20 改。
#
# 原先这里是一份白名单，只列 `*.rs` / `*.ts` / `*.vue` / `Cargo.*` / `package.json` /
# 工具链文件 / `scripts/**`。它**漏掉了 `*.css` / `*.yml` / `*.html`**：
# `tauri/src/styles/` 下 4 个 CSS 文件若被单独修改，**四个作业一个都不跑**，
# 于是 `style-audit` 那条 ERROR 级规则（使用的类必须有定义）对纯 CSS 改动完全不生效。
#
# 白名单的隐含假设是"没列进来的文件不影响任何检查"，CSS 这条反例直接证伪了它；
# 而且这种漏法**不会有任何提示**——CI 安静地绿着。黑名单的代价是"多跑"，
# 白名单的代价是"漏跑"，而**漏跑的代价远大于多跑**（漏跑时没人知道该跑的没跑）。
#
# 已知的代价（接受）：纯文档改动现在也会跑 `rust-checks`（dev + release 两个 profile）。
# 若 CI 时长成为问题，正确做法是**拆出独立的 docs 工作流**（按 `docs/**` 触发），
# 而**不是**退回白名单——那只会把漏跑的风险再请回来。
on:
  # 2026-10-07：`v2-plan` 加入触发分支。
  #
  # 起因是一次**没有信号的漏跑**：在此之前这里只有 `[ main, master ]`，而
  # `v2-plan` 领先 `main` 80 个提交、却连**一次 workflow run 都没有**
  # （`gh run list --branch v2-plan` 为空、无 PR）——1339 个 Rust 单测、42 个 e2e、
  # 14 个守卫的绿灯**只存在于开发者本机**。这与本文件头部「漏跑的代价远大于多跑」
  # 是同一条教训的第二次出现：第一次漏的是文件类型，这次漏的是分支。
  #
  # `workflow_dispatch` 是第三条路（当前没有）：分支不在名单里时，连手动补跑都做不到。
  push:
    branches: [ main, master, v2-plan ]
    paths-ignore:
      # 构建 / 依赖 / 日志等产出目录。它们目前都未被 git 跟踪（见 .gitignore），
      # 列出是防御性的：一旦将来被误纳入版本控制，也不会白白触发全量 CI。
      - '**/node_modules/**'
      - '**/target/**'
      - '**/dist/**'
      - '**/coverage/**'
      - 'tauri/.vbuild*/**'
      - '.workbuddy-ai/**'
  pull_request:
    # 这里是**目标**分支：`v2-plan → main` 的 PR 命中 `main`，早已会跑；
    # 列上 `v2-plan` 是为了反向的 `feat/… → v2-plan` 这类评审也照样被验证。
    branches: [ main, master, v2-plan ]
    paths-ignore:
      - '**/node_modules/**'
      - '**/target/**'
      - '**/dist/**'
      - '**/coverage/**'
      - 'tauri/.vbuild*/**'
      - '.workbuddy-ai/**'
  workflow_dispatch:

jobs:
  # 提交信息规范：与本机 `git config core.hooksPath scripts/git-hooks` 同一套判据
  # （`scripts/check-commit-msg.mjs`）。**只靠本机钩子管不住别人**——钩子是一次性的
  # 本机配置，谁clone下来忘了设就形同没有；故 CI 这边用 `--range` 把本次引入的
  # 提交逐个判一遍。判据只有一处（那个脚本），此处不重抄。
  commit-msg-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 要比对 base 分支，浅克隆看不到那些提交 ⇒ 必须拉全
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Commit message gate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
            # 显式拉 base：`actions/checkout` 默认只取当前 ref，`origin/<base>` 未必存在。
            # 用显式 refspec 而不是依赖 remote.origin.fetch 的配置，结果才是确定的。
            git fetch --no-tags origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
            RANGE="origin/${BASE_BRANCH}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            # 新建分支 / 首次推送时 before 是全 0 ⇒ 退化为「只判本次推送的那些提交」
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$(git rev-parse HEAD~1)"
            fi
            RANGE="${BEFORE}..HEAD"
          fi
          echo "校验范围：$RANGE"
          node scripts/check-commit-msg.mjs --range "$RANGE"

  # Rust代码质量检查
  rust-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [dev, release]
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        # 项目脚本已统一为平台无关的 Node 脚本（scripts/*.mjs），不再依赖 bash / ripgrep
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Rust
        # 使用 rust-toolchain.toml 锁定版本，保证与本地开发环境一致（避免 rustfmt 版本漂移导致 fmt 失败）
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Linux system libs (OpenSSL)
        # HTTP 出口的 TLS 走平台原生栈（ADR-013）：Windows = SChannel、macOS =
        # Security.framework、**Linux = 系统 OpenSSL** ⇒ 只有 Ubuntu runner 需要它。
        # runner 镜像通常已预装，此处显式声明是为了：① 让这条平台前置在 CI 里可见；
        # ② 镜像变更时以「openssl-sys 找不到库」之外的方式暴露出来。
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Linux system libs (GTK/WebKit)
        # workspace 的 members 含 `tauri/src-tauri`，而 Tauri v2 在 Linux 上走
        # GTK/WebKit ⇒ `glib-sys` / `gobject-sys` / `gtk-sys` / `webkit2gtk-sys` /
        # `libappindicator` 的 build script 逐个跑 pkg-config。
        #
        # 2026-10-07 首次在 `v2-plan` 上跑 CI 时实测：`cargo check --tests --workspace`
        # 在第一个 sys crate 就红——
        #   `Package gobject-2.0 was not found in the pkg-config search path.`
        # 在此之前这条路径**从未被执行过**：本地是 Windows，Tauri 走 WebView2，
        # 根本不编 GTK ⇒ 与「分支没接 CI」同族，是**没有信号的漏跑**的第三次。
        #
        # 只装 openssl 是不够的：openssl 那步当时是绿的，红的是它后面的 GTK 链。
        # 清单取 Tauri 官方 Linux 前置（webkit2gtk 4.1 对应 Ubuntu 24.04）。
        # ⚠️ `msrv-check` / `e2e-check` 只编 `symbio` + `cli`、不碰 tauri，故不装这组。
        run: >
          sudo apt-get update && sudo apt-get install -y
          libssl-dev pkg-config
          libwebkit2gtk-4.1-dev libgtk-3-dev
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Build frontend assets (tauri::generate_context! 要求 tauri/dist)
        # `tauri/src-tauri/src/main.rs:110` 的 `tauri::generate_context!()` 是**编译期**
        # 宏：它读 `tauri.conf.json` 的 `"frontendDist": "../dist"` 并要求该路径存在，
        # 不存在就直接 `error: proc macro panicked`。于是 `--workspace` 的四步
        # （check / test / clippy / doc）**全红**，而报错指向的是一段完全正常的 Rust
        # 代码 —— 2026-10-07 首次在 v2-plan 上跑 CI 实测：
        #   = help: message: The `frontendDist` configuration is set to `"../dist"`
        #           but this path doesn't exist
        #
        # `tauri/dist` 被 `tauri/.gitignore` 忽略（`dist/`），**只在开发者本机存在**。
        # 与「分支没接 CI」「本机不编 GTK」「cargo-audit 被项目 pin 拖住」同族：
        # 前置只存在于开发者的机器上，于是这条路径在本机天天绿、在 CI 一次没跑过。
        #
        # 这里真的跑一次 `vite build` 而不是 `mkdir dist` 占位：占位能让 cargo check
        # 过，但那等于把「前端产物与 tauri.conf.json 是否搭得上」从 Rust 构建里抹掉，
        # 而 `generate_context!` 恰恰就是在编译期做这层校验的——占位会让它去校验一个
        # 我们刚编出来的空壳。
        # （前端自身的类型 / 单测 / lint 归 `frontend-checks`；这里只要它的产物。）
        working-directory: tauri
        run: npm ci && npm run build

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Backend gate
        # 与本地**同一条命令**（含 cli/ 独立 workspace）：cargo check --tests、
        # 单测、clippy -D warnings、cargo fmt --check，以及 --profile 指定的构建。
        # ⚠️ 检查项只在 scripts/gate.mjs 里定义一处（CONTRIBUTING 的清单已删），
        #    要加 / 改检查就改脚本，不要在这里另写 cargo 命令。
        run: node scripts/gate.mjs --only=backend --ci --profile=${{ matrix.profile }}
        continue-on-error: false

  # MSRV 验证：`rust-version` 声明的最低版本必须**真能编译**。
  # 其余 job 都锁 rust-toolchain.toml 的 1.93.1 ⇒ 少了这个 job，「1.91」就只是
  # Cargo.toml 里一句没人验证的话（此前正是如此）。检查逻辑在 gate.mjs 的 msrv
  # 阶段，此处不重抄；该阶段会核对实际生效的 rustc 版本，装错了也不会假通过。
  msrv-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install MSRV toolchain
        # 版本须与 symbio/Cargo.toml、cli/Cargo.toml 的 rust-version 一致
        # （gate.mjs 把 "1.91" 补全为 "1.91.0" 后比对；更新的 patch 证明不了下限）
        run: rustup toolchain install 1.91.0 --profile minimal

      - name: Install Linux system libs (OpenSSL)
        # 同 rust-checks：Linux 侧 TLS 依赖系统 OpenSSL（ADR-013）
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .workbuddy-ai/msrv-target
          # 与 rust-checks 分开的 key：不同编译器不共享 artifact，混用只会互相覆盖
          key: ${{ runner.os }}-cargo-msrv191-${{ hashFiles('**/Cargo.lock') }}

      - name: MSRV gate
        run: node scripts/gate.mjs --only=msrv

  # 架构证据验证：`docs/plan/verify/` 的 14 个程序**自己证明自己**。
  #
  # 这批程序是 v2 方案对外声称的"硬证据"（`docs/plan/README.md §4`），此前只能
  # 手敲 rustc 跑一遍、结果抄进 `OUTPUT.md` 提交——**快照不是守卫**，没有任何东西
  # 保证它明天还绿。更关键的是 C29：3 个程序带 `should_not_compile`，声称"投影纯度 /
  # 时延闸门 / 欲的最小形态是编译期强制"。**强制本身必须有反向用例**（验证纪律第 4 条），
  # 否则无法区分"真的强制"与"恰好没写错"。检查逻辑在 gate.mjs 的 verify 阶段，
  # 此处不重抄。
  #
  # 不装额外工具链：`rust-toolchain.toml` 钉了 1.93.1，rustup 在仓库内任何子目录
  # 调 `rustc` 都会自动解析并取用它——在此硬编码版本号会造出第二个真相源。
  verify-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify gate（14 个验证程序 + 3 个编译期反例）
        run: node scripts/gate.mjs --only=verify --ci

  # 前端代码质量检查 (如果存在前端构建工具)
  frontend-checks:
    if: |
      github.event_name == 'push' || 
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          # package-lock.json 位于 tauri/ 子目录，必须显式指定，否则 cache 解析失败
          cache-dependency-path: tauri/package-lock.json
      
      - name: Check frontend dependencies
        working-directory: tauri
        run: npm ci

      - name: Frontend gate
        # 与本地同一条命令：vue-tsc 类型检查 + vitest（含覆盖率阈值）+ vite build。
        # ⚠️ 检查项只在 scripts/gate.mjs 里定义一处（不依赖 npx；脚本直接跑
        #    node_modules 里的二进制，避免 CI 上 npx 解析差异）。
        #    构建此前只在上线打 tag 时才跑 ⇒ 构建错误要等发布才暴露，现已前置到 PR。
        run: node scripts/gate.mjs --only=frontend
        continue-on-error: false

      - name: Validate package.json
        # 注意：npm 没有 `pkg validate` 子命令，这里用 pkg get 验证 package.json 可解析
        run: |
          npm pkg get name version
          npm pkg get name version > /dev/null
        working-directory: tauri

  # 端到端回归：构建 CLI 二进制后，按 e2e/cases/ 发现式运行全部用例
  # （CLI × mock LLM（OpenAI 兼容 SSE）× mock MCP（stdio JSON-RPC）× 临时 homedir）。
  # 用例清单不在这里也不在 gate.d/40-e2e.mjs 里维护——新增 e2e/cases/*.mjs 即自动纳入。
  # 需要系统库：mock 与被测 CLI 都是本地回环 HTTP，无外部依赖；OpenSSL 同 rust-checks。
  e2e-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install frontend deps (e2e 要用的 WS 客户端)
        # ⚠️ 这一步不能省，且**缺了不报"缺依赖"、报的是"42/42 全部用例失败"**：
        # `e2e/helpers.mjs` 第 16 行 `import WebSocket from
        # '../tauri/node_modules/ws/index.js'`——**不为测试再引一份**（该文件头注明说）。
        # 而每个 `e2e/cases/t*.mjs` 都 import helpers ⇒ `tauri/node_modules` 不存在时，
        # 42 个用例**每一个**都在 import 期抛模块解析错误、立即 exit=1，
        # 表现为「42/42 全红、每例 0s」，与"用例本身坏了"完全同形。
        # 2026-10-07 首次在 v2-plan 上跑 CI 时实测：CLI 二进制重建成功（ok 2m2s），
        # 随后 42 例在 0.4 秒内全灭。
        # `frontend-checks` 有 `npm ci`、这个 job 没有——依赖存在与否是**按 job**的。
        working-directory: tauri
        run: npm ci

      - name: Install Linux system libs (OpenSSL)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: E2E gate
        # 与本地同一条命令；--ci 强制重建 CLI 二进制（runner 无缓存二进制）
        run: node scripts/gate.mjs --only=e2e --ci
        continue-on-error: false

  # 文档和配置验证
  docs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Docs & facts gate
        # 与本地同一条命令。检查项清单只在 scripts/gate.mjs 里（此处不重抄，抄了会漂移）：
        # 静态审计阶段含 grep-audit（S-002 异步锁等）、style-audit（使用的类必须有定义）、
        # doc-link-audit（已豁免 docs/archive/）、test-layout-audit、dead-code-audit，
        # 外加报告型 schema-audit；facts 阶段是 docs/CURRENT.md 漂移门禁——事实表由代码
        # 提取生成，改了插件 / 挂载点 / 工具 / 路由就必须重新生成并提交。
        #
        # ⚠️ `--ci` 是必需的，不是装饰：facts（以及 backend 的 fmt）已改为**门禁自己执行**
        # 的确定性机械工作，本地跑会「自动修复 + 暂存」，而 CI 无法提交、只能判红。
        # 少了 `--ci`，这一步就退化成「修复完静默放过漂移」——一个只亮绿灯的检查项。
        # 回归测试 scripts/gate.d/_shared.test.mjs 断言了这一行必须带 `--ci`。
        run: node scripts/gate.mjs --only=docs,facts --ci
        continue-on-error: false

      - name: Check for obvious documentation issues
        run: |
          # 检查README是否存在基本结构
          if ! grep -q "^# Symbio" README.md; then
            echo "README.md 格式异常"
            exit 1
          fi
          
          # 检查Cargo.toml基本字段
          if ! grep -q "^name = " symbio/Cargo.toml; then
            echo "symbio/Cargo.toml 缺少name字段"
            exit 1
          fi
          
          echo "基础文档和配置检查通过"

  # 安全检查 (可选)
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install cargo-audit
        # ⚠️ 必须显式 `+stable`：仓库根的 `rust-toolchain.toml` 钉 **1.93.1**，
        # 不带工具链前缀时 `cargo install` 会**拿本项目的 pin 去编 cargo-audit 自己的
        # 依赖**，而它的依赖已经跑到需要更新的编译器 —— 2026-10-07 实测：
        #   error: failed to compile `cargo-audit v0.22.2`
        #   rustc 1.93.1 is not supported by the following package:
        #     kstring@2.0.5 requires rustc 1.96.0
        # 于是这个 job 红在**安装工具**那一步，一条漏洞都没扫到。
        #
        # cargo-audit 是**开发工具**、不是本项目的产物：它的 MSRV 与本仓库的
        # `rust-version`（1.91）无关，也不该被 pin 拖住。pin 保住的是「编出来的东西
        # 与本地一致」，而这里编的是工具本身。
        run: cargo +stable install cargo-audit
      
      - name: Run security audit
        # ⚠️ **必须在仓库根跑**：本仓是单 workspace，`Cargo.lock` 只有根目录那一份
        # （`symbio/Cargo.lock` / `cli/Cargo.lock` 都不存在）。原先这里写着
        # `working-directory: symbio`，而 cargo-audit 只在 cwd 找 `Cargo.lock`、**不向
        # 上找 workspace 根**，于是它必然失败：
        #   error: not found: Couldn't load Cargo.lock
        # 这是**既有配置错误**——此前从未暴露，因为 cargo-audit 自己就装不上
        # （见上一步：工具被 rust-toolchain.toml 的 pin 拖住）。两层壳剥掉一层，
        # 才露出里面这层。
        run: cargo audit --ignore RUSTSEC-2020-0058 --ignore RUSTSEC-2021-0099
        # 忽略一些已知的误报或低严重性问题