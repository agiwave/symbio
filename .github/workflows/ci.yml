name: CI

# ⚠️ **用黑名单（`paths-ignore`）而不是白名单（`paths`）** —— 2026-09-20 改。
#
# 原先这里是一份白名单，只列 `*.rs` / `*.ts` / `*.vue` / `Cargo.*` / `package.json` /
# 工具链文件 / `scripts/**`。它**漏掉了 `*.css` / `*.yml` / `*.html`**：
# `tauri/src/styles/` 下 4 个 CSS 文件若被单独修改，**四个作业一个都不跑**，
# 于是 `style-audit` 那条 ERROR 级规则（使用的类必须有定义）对纯 CSS 改动完全不生效。
#
# 白名单的隐含假设是"没列进来的文件不影响任何检查"，CSS 这条反例直接证伪了它；
# 而且这种漏法**不会有任何提示**——CI 安静地绿着。黑名单的代价是"多跑"，
# 白名单的代价是"漏跑"，而**漏跑的代价远大于多跑**（漏跑时没人知道该跑的没跑）。
#
# 已知的代价（接受）：纯文档改动现在也会跑 `rust-checks`（dev + release 两个 profile）。
# 若 CI 时长成为问题，正确做法是**拆出独立的 docs 工作流**（按 `docs/**` 触发），
# 而**不是**退回白名单——那只会把漏跑的风险再请回来。
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      # 构建 / 依赖 / 日志等产出目录。它们目前都未被 git 跟踪（见 .gitignore），
      # 列出是防御性的：一旦将来被误纳入版本控制，也不会白白触发全量 CI。
      - '**/node_modules/**'
      - '**/target/**'
      - '**/dist/**'
      - '**/coverage/**'
      - 'tauri/.vbuild*/**'
      - '.workbuddy-ai/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**/node_modules/**'
      - '**/target/**'
      - '**/dist/**'
      - '**/coverage/**'
      - 'tauri/.vbuild*/**'
      - '.workbuddy-ai/**'

jobs:
  # 提交信息规范：与本机 `git config core.hooksPath scripts/git-hooks` 同一套判据
  # （`scripts/check-commit-msg.mjs`）。**只靠本机钩子管不住别人**——钩子是一次性的
  # 本机配置，谁clone下来忘了设就形同没有；故 CI 这边用 `--range` 把本次引入的
  # 提交逐个判一遍。判据只有一处（那个脚本），此处不重抄。
  commit-msg-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 要比对 base 分支，浅克隆看不到那些提交 ⇒ 必须拉全
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Commit message gate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
            # 显式拉 base：`actions/checkout` 默认只取当前 ref，`origin/<base>` 未必存在。
            # 用显式 refspec 而不是依赖 remote.origin.fetch 的配置，结果才是确定的。
            git fetch --no-tags origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
            RANGE="origin/${BASE_BRANCH}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            # 新建分支 / 首次推送时 before 是全 0 ⇒ 退化为「只判本次推送的那些提交」
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$(git rev-parse HEAD~1)"
            fi
            RANGE="${BEFORE}..HEAD"
          fi
          echo "校验范围：$RANGE"
          node scripts/check-commit-msg.mjs --range "$RANGE"

  # Rust代码质量检查
  rust-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [dev, release]
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        # 项目脚本已统一为平台无关的 Node 脚本（scripts/*.mjs），不再依赖 bash / ripgrep
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Rust
        # 使用 rust-toolchain.toml 锁定版本，保证与本地开发环境一致（避免 rustfmt 版本漂移导致 fmt 失败）
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Linux system libs (OpenSSL)
        # HTTP 出口的 TLS 走平台原生栈（ADR-013）：Windows = SChannel、macOS =
        # Security.framework、**Linux = 系统 OpenSSL** ⇒ 只有 Ubuntu runner 需要它。
        # runner 镜像通常已预装，此处显式声明是为了：① 让这条平台前置在 CI 里可见；
        # ② 镜像变更时以「openssl-sys 找不到库」之外的方式暴露出来。
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Backend gate
        # 与本地**同一条命令**（含 cli/ 独立 workspace）：cargo check --tests、
        # 单测、clippy -D warnings、cargo fmt --check，以及 --profile 指定的构建。
        # ⚠️ 检查项只在 scripts/gate.mjs 里定义一处（CONTRIBUTING 的清单已删），
        #    要加 / 改检查就改脚本，不要在这里另写 cargo 命令。
        run: node scripts/gate.mjs --only=backend --ci --profile=${{ matrix.profile }}
        continue-on-error: false

  # MSRV 验证：`rust-version` 声明的最低版本必须**真能编译**。
  # 其余 job 都锁 rust-toolchain.toml 的 1.93.1 ⇒ 少了这个 job，「1.91」就只是
  # Cargo.toml 里一句没人验证的话（此前正是如此）。检查逻辑在 gate.mjs 的 msrv
  # 阶段，此处不重抄；该阶段会核对实际生效的 rustc 版本，装错了也不会假通过。
  msrv-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install MSRV toolchain
        # 版本须与 symbio/Cargo.toml、cli/Cargo.toml 的 rust-version 一致
        # （gate.mjs 把 "1.91" 补全为 "1.91.0" 后比对；更新的 patch 证明不了下限）
        run: rustup toolchain install 1.91.0 --profile minimal

      - name: Install Linux system libs (OpenSSL)
        # 同 rust-checks：Linux 侧 TLS 依赖系统 OpenSSL（ADR-013）
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .workbuddy-ai/msrv-target
          # 与 rust-checks 分开的 key：不同编译器不共享 artifact，混用只会互相覆盖
          key: ${{ runner.os }}-cargo-msrv191-${{ hashFiles('**/Cargo.lock') }}

      - name: MSRV gate
        run: node scripts/gate.mjs --only=msrv

  # 前端代码质量检查 (如果存在前端构建工具)
  frontend-checks:
    if: |
      github.event_name == 'push' || 
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          # package-lock.json 位于 tauri/ 子目录，必须显式指定，否则 cache 解析失败
          cache-dependency-path: tauri/package-lock.json
      
      - name: Check frontend dependencies
        working-directory: tauri
        run: npm ci

      - name: Frontend gate
        # 与本地同一条命令：vue-tsc 类型检查 + vitest（含覆盖率阈值）+ vite build。
        # ⚠️ 检查项只在 scripts/gate.mjs 里定义一处（不依赖 npx；脚本直接跑
        #    node_modules 里的二进制，避免 CI 上 npx 解析差异）。
        #    构建此前只在上线打 tag 时才跑 ⇒ 构建错误要等发布才暴露，现已前置到 PR。
        run: node scripts/gate.mjs --only=frontend
        continue-on-error: false

      - name: Validate package.json
        # 注意：npm 没有 `pkg validate` 子命令，这里用 pkg get 验证 package.json 可解析
        run: |
          npm pkg get name version
          npm pkg get name version > /dev/null
        working-directory: tauri

  # 端到端回归：构建 CLI 二进制后，按 e2e/cases/ 发现式运行全部用例
  # （CLI × mock LLM（OpenAI 兼容 SSE）× mock MCP（stdio JSON-RPC）× 临时 homedir）。
  # 用例清单不在这里也不在 gate.d/40-e2e.mjs 里维护——新增 e2e/cases/*.mjs 即自动纳入。
  # 需要系统库：mock 与被测 CLI 都是本地回环 HTTP，无外部依赖；OpenSSL 同 rust-checks。
  e2e-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Linux system libs (OpenSSL)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: E2E gate
        # 与本地同一条命令；--ci 强制重建 CLI 二进制（runner 无缓存二进制）
        run: node scripts/gate.mjs --only=e2e --ci
        continue-on-error: false

  # 文档和配置验证
  docs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Docs & facts gate
        # 与本地同一条命令。检查项清单只在 scripts/gate.mjs 里（此处不重抄，抄了会漂移）：
        # 静态审计阶段含 grep-audit（S-002 异步锁等）、style-audit（使用的类必须有定义）、
        # doc-link-audit（已豁免 docs/archive/）、test-layout-audit、dead-code-audit，
        # 外加报告型 schema-audit；facts 阶段是 docs/CURRENT.md 漂移门禁——事实表由代码
        # 提取生成，改了插件 / 挂载点 / 工具 / 路由就必须重新生成并提交。
        run: node scripts/gate.mjs --only=docs,facts
        continue-on-error: false

      - name: Check for obvious documentation issues
        run: |
          # 检查README是否存在基本结构
          if ! grep -q "^# Symbio" README.md; then
            echo "README.md 格式异常"
            exit 1
          fi
          
          # 检查Cargo.toml基本字段
          if ! grep -q "^name = " symbio/Cargo.toml; then
            echo "symbio/Cargo.toml 缺少name字段"
            exit 1
          fi
          
          echo "基础文档和配置检查通过"

  # 安全检查 (可选)
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run security audit
        working-directory: symbio
        run: cargo audit --ignore RUSTSEC-2020-0058 --ignore RUSTSEC-2021-0099
        # 忽略一些已知的误报或低严重性问题