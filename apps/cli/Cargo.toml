[package]
name = "symbio-cli"
version = "0.1.0"
description = "Symbio 命令行客户端与浏览器 Server（同一二进制）"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[[bin]]
name = "symbio-cli"
path = "src/main.rs"

[dependencies]
symbio-platform = { path = "../../crates/symbio-platform" }
symbio-plugin-api = { path = "../../crates/symbio-plugin-api" }
# 核心库：进程内直连同一套分形插件树；serve 模式经共享 RuntimeHost 提供 HTTP/WS。
symbio = { path = "../../crates/symbio" }
symbio-runtime = { path = "../../crates/symbio-runtime" }
# include_dir 只被 CLI 的 build.rs / embedded_ui 用来编译期内嵌 packages/ui/dist。
# 内嵌只属于需要 serve 的 CLI 入口；桌面原生窗口也是加载 CLI serve 的地址，不另嵌 UI。
include_dir = { workspace = true }
# 版本与 features 刻意与 ../../crates/symbio/Cargo.toml 完全一致：
# 同一份 tokio 单元 → 复用仓库根 target/ 里已编译好的 rlib，避免重复编译。
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
