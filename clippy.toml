# Clippy 配置
# 与 CONTRIBUTING.md 中"Rust 规范"章节保持一致
# CI 执行：cargo clippy --all-targets -- -D warnings

# 当且仅当相应 lints 被升级为 deny 时，下面的 allow 仍然会被尊重。
# 这里只放项目级（默认）策略；具体禁用需在源码中以属性形式标注。

avoid-breaking-exported-api = false
# 与 symbio/Cargo.toml 的 rust-version 保持一致。
# 代码依赖 TypeId::of 在 const 上下文的稳定化（1.91），故 MSRV 锁定 1.91。
msrv = "1.91"
