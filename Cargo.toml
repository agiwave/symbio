# 根 workspace：cli / symbio / tauri 三者共用仓库根的 target/，
# symbio 只编译一次（此前三个独立 workspace 各编译一遍，约 70G 重复产物）。
#
# 工具链统一锁在根 rust-toolchain.toml（1.93.1），含 tauri——不再走 stable。
# 单个 target 目录要求所有 crate 用同一个 rustc，否则会触发 E0514
# （found crate compiled by incompatible version of rustc）/ 全量重编。
[workspace]
resolver = "2"
members = ["crates/*", "tauri/src-tauri"]

# 外部依赖的**唯一版本源**：成员只声明「用不用、带哪些 feature」，不写版本。
# 内部 crate 之间仍用 path（相对路径是目录结构的投影，集中到根反而多一处要同步的地址）。
[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.22.1"
bstr = "1.13.1"
dashmap = "6.2.1"
dirs = "6.0.0"
encoding_rs = "0.8.35"
futures = "0.3.34"
glob = "0.3.4"
globset = "0.4.20"
grep = "0.4.1"
ignore = "0.4.33"
indexmap = "2.14.1"
inventory = "0.3.24"
notify = "8.2.0"
ort = "2.0.0-rc.13"
regex = "1.13.1"
# TLS 后端 = 平台原生栈（D-013）：默认特性会拉进 rustls + aws-lc-sys（~69 MB C 源码 + cmake），
# 故默认关闭，由使用方补回 default 里的非 TLS 能力（charset · http2 · system-proxy）。
reqwest = { version = "0.13.4", default-features = false }
reqwest-eventsource = "0.6.0"
serde = "1.0.229"
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
shellexpand = "3.1.2"
tauri = "2.0"
tauri-build = "2.0"
tauri-plugin-dialog = "2.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = "0.3.55"
# 默认特性硬编码 `tokenizers/onig`（onig_sys ⇒ 真正的 C 编译链）；本仓只用纯 Rust 的 fancy-regex。
tokenizers = { version = "0.22.2", default-features = false }
tokio = "1.53.1"
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = "1.26.0"
which = "8.0.6"
# 默认特性拉入 zstd/lzma 等 C 编译包；本仓只用纯 Rust 的 deflate（flate2/miniz_oxide）。
zip = { version = "2.4.1", default-features = false }

# —— profile 只在根 manifest 生效：写在成员 crate 里的同名块会被 cargo 静默忽略。 ——

# 测试构建提速：测试二进制约 89MB（含 ort/ONNX），完整调试信息使
# MSVC 链接长达 20+ 分钟。line-tables-only 保留行号表、去掉变量级调试信息，
# 链接时间缩短一个量级。只影响 cargo test / cargo bench。
[profile.test]
debug = "line-tables-only"

# 壳的发布/开发档位。
[profile.dev]
incremental = false
opt-level = 0

[profile.release]
opt-level = "s"

[profile.release.package."*"]
codegen-units = 1
