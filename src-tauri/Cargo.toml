[package]
name = "symbio"
version = "0.1.1"
description = "A Tauri application with fractal plugin system"
authors = ["Symbio Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
dirs = "5.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
async-stream = "0.3"
url = "2.5"
shellexpand = "3.1"
glob = "0.3"
which = "6.0"
regex = "1.10"
urlencoding = "2.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
serde_yaml = "0.9"
notify = "6.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = false
opt-level = 0

[profile.release]
opt-level = "s"
