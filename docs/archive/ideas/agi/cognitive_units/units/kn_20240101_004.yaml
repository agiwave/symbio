  storage_value: store
  notes: |
    大模型可能知道知识、经验、技能的一般区分，
    但不知道这套七分类系统：
    1. 具体的七种类型定义
    2. 每种类型的存储重点和检索模式
    3. 系统间的交互方式
    这是本架构的核心分类，必须存储。

