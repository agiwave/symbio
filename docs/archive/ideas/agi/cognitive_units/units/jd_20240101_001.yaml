  notes: |
    大模型可以给出一般的设计原则（如KISS、DRY等），
    但不知道这套特定的原则组合：
    1. 存储差异化，而非全面化（针对大模型时代的新原则）
    2. 这个项目中具体如何权衡
    3. 为什么这样选择
    
    这是本架构的核心价值观，影响所有设计决策。

