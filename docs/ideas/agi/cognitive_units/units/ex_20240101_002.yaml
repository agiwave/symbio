# 认知单元：过度抽象的失败教训
# 类型：experience（经验）
# 级别：Level 3（专家独有经验）

id: ex_20240101_002
type: experience

content:
  summary: "为一个简单的表单创建了复杂的抽象层，最终因维护成本过高而废弃"
  body:
    situation: |
      项目需要一个表单组件，支持多种字段类型（文本、选择、日期等）。
      预期后续会有很多类似的表单，于是决定设计一个"通用表单框架"。
    
    action:
      initial_design:
        description: "设计了一个多层抽象架构"
        components:
          - "FormField 基类（抽象类）"
          - "TextField/SelectField/DateField 等子类"
          - "FormValidator 验证器"
          - "FormRenderer 渲染器"
          - "FormStateManager 状态管理器"
        time_invested: "2周"
      
      implementation:
        description: "实现了完整的基础设施"
        files_created: 15
        lines_of_code: 2000
      
      first_form:
        description: "用框架实现第一个表单"
        time_taken: "3天"
        complexity: "比直接写复杂3倍"
    
    result:
      outcome: "失败"
      problems:
        - problem: "过度工程"
          detail: "框架复杂度远超表单本身的需求"
        
        - problem: "学习成本高"
          detail: "团队成员需要学习框架才能使用"
        
        - problem: "灵活性不足"
          detail: "每个特殊需求都需要修改框架"
        
        - problem: "维护负担"
          detail: "框架本身的bug和优化消耗大量时间"
        
        - problem: "ROI很低"
          detail: "实际只做了3个表单，框架就废弃了"
    
    lessons_learned:
      primary_lesson:
        principle: "YAGNI (You Aren't Gonna Need It)"
        description: "不要为假设的未来需求过度设计"
        application: "至少做3个相似场景后再考虑抽象"
      
      secondary_lessons:
        - lesson: "简单复制不是坏事"
          context: "复制粘贴几份代码比维护复杂框架成本低"
        
        - lesson: "先痛苦再抽象"
          context: "只有在重复劳动中感到痛苦时才抽象"
        
        - lesson: "抽象需要足够的样本"
          context: "至少3个具体实例才能发现真正的共性"
        
        - lesson: "简单方案的生命周期更长"
          context: "简单方案更容易理解和修改"
    
    better_approach:
      step_1: "先用最简单的方式实现第一个表单"
      step_2: "复制修改实现第二个表单，记录重复的部分"
      step_3: "实现第三个表单，确认共性模式"
      step_4: "如果确实有清晰的模式，再做适度抽象"
      step_5: "抽象要保守，优先组合而非继承"
    
    applicability:
      applies_when:
        - "感觉'这个以后肯定用得上'"
        - "想设计一个'通用框架'"
        - "抽象层次超过2层"
      warning_signs:
        - "框架代码超过业务代码"
        - "第一个使用者需要培训"
        - "简单需求需要复杂配置"
  
  format: narrative

