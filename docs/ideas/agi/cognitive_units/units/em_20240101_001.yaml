  notes: |
    大模型有默认的风格，但不知道：
    1. 这套具体的偏好设置
    2. 每种偏好的具体含义和影响
    3. 对输出的具体影响方式
    这是核心的风格定义，必须存储。
    这决定了"是谁的专家"。

