# 认知单元：专家认知架构核心概念
# 类型：knowledge（知识）
# 级别：Level 1（准通用知识 - 大模型知道概念，但此文档有独特架构见解）

id: kn_20240101_001
type: knowledge

content:
  summary: "专家认知架构是将专家知识和能力数字化的统一数据模型，包含认知单元和六维度结构"
  body:
    definition: |
      专家认知架构是一种将人类专家的知识、经验、技能、判断、策略、直觉和情感
      统一建模的系统架构，旨在让AI能够像真正的专家一样辅导用户。
    
    core_concepts:
      - 认知单元（CognitiveUnit）：存储知识和能力的统一数据结构
      - 六维度模型：是什么、何时用、有多强、从哪来、怎么用过、和什么相关
      - 四层架构：存储层、动态学习层、系统视图层、辅导应用层
      - 七大认知系统：知识、经验、技能、判断、策略、直觉、情感
    
    key_innovations:
      - 统一数据结构：不同类型认知内容使用相同字段结构
      - 关系嵌入：关系直接存储在单元中，简化查询
      - 通用度分级：区分通用知识和专家独有知识
      - 与LLM分工：只存储差异化知识，避免冗余
    
    typical_scenarios:
      - 专家知识沉淀与传承
      - AI辅助教学与辅导
      - 团队知识资产管理
      - 个人知识备份
  
