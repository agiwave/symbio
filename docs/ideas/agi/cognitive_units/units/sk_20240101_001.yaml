# 认知单元：激活扩散机制
# 类型：skill（技能）
# 级别：Level 2（项目特定知识）

id: sk_20240101_001
type: skill

content:
  summary: "激活扩散是从激活的认知单元出发，沿关系网络传播激活的核心检索机制"
  body:
    definition: |
      激活扩散（Spreading Activation）是一种模拟人类联想记忆的检索机制。
      当某个认知单元被激活后，激活会沿着关系网络传播到相关单元，
      从而检索出与当前情境相关的内容。
    
    core_algorithm:
      step_1:
        name: "初始激活"
        description: "根据用户输入，激活匹配的认知单元"
        formula: "activation_level = base_activation × context_match_score"
      
      step_2:
        name: "激活传播"
        description: "激活从高激活单元沿关系传播"
        formula: "target_activation += source_activation × relation_weight × decay_factor"
        parameters:
          decay_factor: "每传播一层衰减系数，如0.8"
          min_threshold: "最小激活阈值，低于此值不传播"
      
      step_3:
        name: "迭代扩散"
        description: "重复传播直到收敛"
        stop_conditions:
          - "激活值低于阈值"
          - "达到最大迭代次数"
          - "工作记忆已满（7±2个单元）"
      
      step_4:
        name: "结果排序"
        description: "按最终激活值排序，返回top-k结果"
    
    key_parameters:
      initial_activation: 
        value: 1.0
        description: "初始激活单元的激活值"
      
      decay_factor:
        value: 0.7
        description: "每层传播的衰减系数"
      
      min_threshold:
        value: 0.1
        description: "最小激活阈值"
      
      max_iterations:
        value: 5
        description: "最大传播层数"
      
      working_memory_size:
        value: 7
        description: "工作记忆容量"
    
    implementation_example: |
      1. 用户问"React性能优化"
      2. 初始激活：匹配到kn_react_performance（激活值1.0）
      3. 第一轮传播：
         - ex_virtual_list (1.0 × 0.8 × 0.7 = 0.56)
         - kn_react_hooks (1.0 × 0.6 × 0.7 = 0.42)
      4. 第二轮传播：
         - sk_profiling (0.56 × 0.7 × 0.7 = 0.27)
         - jd_performance_first (0.56 × 0.8 × 0.7 = 0.31)
      5. 排序返回激活值最高的7个单元
    
    optimization_techniques:
      - "预计算常用路径"
      - "缓存激活结果"
      - "增量传播（只传播新增激活）"
  
  format: procedural

