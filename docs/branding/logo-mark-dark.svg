<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Symbio mark for dark backgrounds">
  <title>Symbio</title>
  <desc>透明底标记（深色背景用）：亮靛蓝与亮青绿双环编织，白色中心节点</desc>
  <defs>
    <linearGradient id="sym-dk-indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="sym-dk-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <circle cx="204" cy="256" r="92" fill="none" stroke="url(#sym-dk-indigo)" stroke-width="42"/>
  <circle cx="308" cy="256" r="92" fill="none" stroke="url(#sym-dk-teal)" stroke-width="42"/>

  <path d="M 227.8 167.1 A 92 92 0 0 1 278.4 201.9"
        fill="none" stroke="url(#sym-dk-indigo)" stroke-width="42" stroke-linecap="round"/>
  <path d="M 284.2 344.9 A 92 92 0 0 1 233.6 310.1"
        fill="none" stroke="url(#sym-dk-teal)" stroke-width="42" stroke-linecap="round"/>

  <circle cx="256" cy="256" r="28" fill="#ffffff"/>
</svg>
