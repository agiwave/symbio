# Symbio 项目推进计划

project:
  name: Symbio
  description: 在做中学：生信分析的互动学习平台
  version: 0.1.0
  created: 2026-03-29
  updated: 2026-03-30
  status: development

# 系统架构（已固定，不可修改）
architecture:
  frontend:
    framework: Vue 3 + TypeScript
    build: Vite
    state: Pinia
    router: Vue Router
  backend:
    framework: Tauri 2.0
    language: Rust
  plugins:
    root: home
    children:
      - work      # 工作区管理
      - agent     # AI交互
      - setting   # 设置管理
  storage:
    local: localStorage / SQLite

# 功能模块
modules:
  - id: workspace
    name: 工作区模块
    description: 文档管理、Markdown编辑、代码执行
    plugin: work
    priority: P0
    
  - id: agent
    name: 智能体模块
    description: AI对话、智能辅助、错误诊断
    plugin: agent
    priority: P0
    
  - id: setting
    name: 设置模块
    description: 用户配置、偏好管理
    plugin: setting
    priority: P1

# 项目阶段
phases:
  - id: phase-1
    name: 核心能力 (MVP)
    goal: 验证「编辑 + 执行 + AI辅助」的基本价值
    status: in_progress
    milestones:
      - 工作区文档管理功能完善
      - AI对话能力接入
      - 基础设置功能可用

  - id: phase-2
    name: 体验优化
    goal: 提升执行效率，增加结果验证能力
    status: pending
    depends_on: [phase-1]
    milestones:
      - 执行进度可视化
      - 结果验证机制
      - 错误自动诊断

  - id: phase-3
    name: 学习能力增强
    goal: 帮助用户形成自己的分析套路
    status: pending
    depends_on: [phase-2]
    milestones:
      - 学习进度追踪
      - 流程保存复用
      - 个人能力图谱

