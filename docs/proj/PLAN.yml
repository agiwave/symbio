# Symbiont 项目推进计划

project:
  name: Symbiont
  description: 在做中学：生信分析的互动学习平台
  version: 0.1.0
  created: 2026-03-29
  status: planning

# 项目阶段
phases:
  - id: phase-1
    name: 核心能力 (MVP)
    goal: 验证「执行 + 记录 + 复用」的基本价值
    duration: 8 weeks
    status: pending
    milestones:
      - 用户能上传数据并识别类型
      - 用户能执行 RNA-seq 分析流程
      - 分析结果自动记录到文档
      - 分析流程可保存和复用

  - id: phase-2
    name: 体验优化 + 结果验证
    goal: 提升执行效率，增加结果验证能力
    duration: 6 weeks
    status: pending
    depends_on: [phase-1]
    milestones:
      - 执行进度可视化
      - 结果三层验证机制
      - 错误自动诊断
      - 更多分析类型支持

  - id: phase-3
    name: 学习能力增强
    goal: 帮助用户形成自己的分析套路
    duration: 6 weeks
    status: pending
    depends_on: [phase-2]
    milestones:
      - 学习进度追踪
      - 知识点关联
      - 流程个性化
      - 个人能力图谱

  - id: phase-4
    name: 深度学习
    goal: 长期记忆与风格学习
    duration: 8 weeks
    status: pending
    depends_on: [phase-3]
    milestones:
      - 跨项目经验复用
      - 用户偏好学习
      - 隐性需求感知

