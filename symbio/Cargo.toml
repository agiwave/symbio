[package]
name = "symbio"
version = "0.1.13"
description = "Symbio core plugin system - a fractal plugin architecture library"
authors = ["Symbio Team"]
license = "MIT"
repository = ""
edition = "2021"
# 最低支持 Rust 版本（MSRV）——与 cli/Cargo.toml 的 rust-version、clippy.toml 的 msrv 一致。
# 1.91 是**语言特性下限**：submit_object_creator! 依赖 TypeId::of 在 const 上下文的稳定化。
# 它不是「本机使用的版本」：本机与 CI 固定用 symbio/rust-toolchain.toml 的 1.93.1。
# 该声明**由 CI 实编译验证**：`.github/workflows/ci.yml` 的 msrv-check job 装 1.91.0
# 后跑 `node scripts/gate.mjs --only=msrv`（本地装了同一工具链也会顺带跑到）。
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3.34"
async-trait = "0.1.92"
thiserror = "2.0.20"
indexmap = { version = "2.14.1", features = ["serde"] }
dirs = "6.0.0"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
# 优化 1：从 chrono 迁移到更轻量的 time
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
# TLS 后端 = 平台原生栈：Windows → SChannel，macOS → Security.framework，Linux → 系统 OpenSSL。
# Windows/macOS 上因此**零 C 编译**（schannel 是纯 Rust FFI 绑定，无源码、无 build.rs）。
# 代价是引入平台分支：Linux 侧需要系统 OpenSSL（libssl-dev），否则要改开 native-tls-vendored。
# 换来的是整条 rustls 链退出构建 —— aws-lc-sys 是 414 个 .c + 178 个 .cc + 941 个汇编、
# 145k 行 C，且**无条件**依赖 cmake，曾是依赖树里最脆的一环。
# `default-features = false` 后必须显式补回 `default` 里的非 TLS 能力：
#   charset（响应体编码判定）· http2（LLM API 基本都走 h2）· system-proxy（读系统代理）。
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "system-proxy",
    "native-tls",
] }
reqwest-eventsource = "0.6.0"
async-stream = "0.3.6"
url = "2.5.8"
shellexpand = "3.1.2"
glob = "0.3.4"
which = "8.0.6"
regex = "1.13.1"
# 跨平台内容搜索：直接调用 ripgrep 库（替代对 rg/PowerShell/grep 可执行文件的依赖），并遵循 .gitignore
grep = "0.4.1"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
ignore = "0.4.33"
globset = "0.4.20"
bstr = "1.13.1"
urlencoding = "2.1.3"
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# 优化 2：替换已停止维护的 serde_yaml（serde_yml 也不维护且有漏洞，改用其维护中的 fork）
serde_yaml_ng = "0.10.0"
notify = "8.2.0"
dashmap = "6.2.1"
inventory = "0.3.24"
encoding_rs = "0.8.35"
# 本地嵌入（`providers/embedding/local.rs`）：跑 int8 量化的 bge-small-zh-v1.5
# （model.onnx / tokenizer.json 由 `include_bytes!` 编进二进制，**从不下载模型**）。
#
# 选型见 ADR-016（本行下方是结论，理由与实测数据在 ADR 里）：
# - **推理用 `ort`**（ONNX Runtime 的 Rust 绑定）。此前用 `tract-onnx` 纯 Rust 推理，
#   因实测每 token ≈ 22.5ms、512 token 单块 ≈ 9.83s，全仓建索引 ≈ 6 小时，**不可用**；
#   换 ort 后同一块 19ms（≈520×），全仓建索引 59s。
# - **零 C/C++ 编译仍然成立**：`ort` 默认 features 走 `tls-native`（Windows 为 schannel），
#   不拉 `ring`；`ort-sys` 的 ONNX Runtime 是 **build 期下载预编译二进制**，不编译源码。
#   `cargo tree -i cc / ring / onig_sys` 三者均为空。
#   **不要**开 `tls-rustls`（会把 `ring` 的 C/汇编链拉回来）。
# - **但预编译产物不便宜，别以为它免费**：Windows x64 拿到的是 **DirectML flavour**
#   （`BinariesSource::Pyke`，其源码注释写明 "pyke libs always ship compiled with DirectML
#   on Windows"，无法用 features 关掉）⇒ 构建缓存 `%LOCALAPPDATA%\ort.pyke.io` 落
#   341 MB `onnxruntime.lib` + 18 MB `DirectML.dll`；且 exe **静态导入 `DirectML.dll`**
#   （已用 PE 导入表核对，非延迟加载）。好在 Win10 1903+ / Win11 由系统提供该 DLL，
#   实测删掉随包的那份仍能推理。离线构建会静默退化为「不链接」，到链接期才报
#   `undefined symbol: OrtGetApiBase`——CI 需要能联网，或用 `ORT_LIB_LOCATION` 指本地副本。
# - **不依赖 `fastembed`**：它硬编码 `tokenizers/onig`（⇒ `onig_sys` ⇒ 真正的 C 编译链），
#   而分词我们自己用 `tokenizers` + `fancy-regex`（纯 Rust）就够——`fastembed` 唯一
#   不可替代的部分只是"调 ORT"，直接依赖 `ort` 即可。
# - MSRV：`ort` 2.0.0-rc.13 = 1.88，低于本仓 1.91。
# - 数值基线：CLS 池化 + L2 归一化；与 tract 时代的余弦相似度见 ADR-016（实测 ≥0.9967）。
ort = "2.0.0-rc.13"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
moka = { version = "0.12.16", features = ["future"] }
# 统一资源协议：zip 上传解压（MCP / Skill / Agent 以 zip 为主，文件名=目录名）
# 仅启用 deflate（flate2/miniz_oxide，纯 Rust）：默认 features 会拉入 zstd/lzma 等 C 编译包
zip = { version = "2.4.1", default-features = false, features = ["deflate"] }
# base64 编码：zip 字节经 JSON payload 传输（agent 插件）
base64 = "0.22.1"

[workspace]
members = [
    ".",
]

# 测试构建提速：测试二进制约 89MB（含 ort/ONNX），完整调试信息使 MSVC 链接长达 20+ 分钟。
# line-tables-only 保留堆栈回溯所需的行号表，去掉变量级调试信息，链接时间可缩短一个量级。
# 只影响 cargo test / cargo bench；cargo check 与常规 dev 构建不受影响。
[profile.test]
debug = "line-tables-only"

[dev-dependencies]
tempfile = "3.27.0"
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { version = "1.53.1", features = ["test-util"] }
