[package]
name = "symbio"
version = "0.1.5"
description = "Symbio core plugin system - a fractal plugin architecture library"
authors = ["Symbio Team"]
license = "MIT"
repository = ""
edition = "2021"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "allow"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
dirs = "5.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
async-stream = "0.3"
url = "2.5"
shellexpand = "3.1"
glob = "0.3"
which = "6.0"
regex = "1.10"
urlencoding = "2.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
serde_yaml = "0.9"
notify = "6.1"
