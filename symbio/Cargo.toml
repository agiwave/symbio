[package]
name = "symbio"
version = "0.1.5"
description = "Symbio core plugin system - a fractal plugin architecture library"
authors = ["Symbio Team"]
license = "MIT"
repository = ""
edition = "2021"
# 最低支持 Rust 版本（与 clippy.toml 的 msrv 保持一致）
# 主要使用 1.95.0 stable；锁定 1.91 是因为 submit_object_creator! 宏依赖
# TypeId::of 在 const 上下文的稳定化（1.91 起 stable）
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3.34"
async-trait = "0.1.92"
thiserror = "2.0.20"
indexmap = { version = "2.14.1", features = ["serde"] }
dirs = "6.0.0"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
# 优化 1：从 chrono 迁移到更轻量的 time
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
reqwest-eventsource = "0.6.0"
async-stream = "0.3.6"
url = "2.5.8"
shellexpand = "3.1.2"
glob = "0.3.4"
which = "8.0.6"
regex = "1.13.1"
# 跨平台内容搜索：直接调用 ripgrep 库（替代对 rg/PowerShell/grep 可执行文件的依赖），并遵循 .gitignore
grep = "0.4.1"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
ignore = "0.4.33"
globset = "0.4.20"
bstr = "1.13.1"
urlencoding = "2.1.3"
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# 优化 2：替换已停止维护的 serde_yaml（serde_yml 也不维护且有漏洞，改用其维护中的 fork）
serde_yaml_ng = "0.10.0"
notify = "8.2.0"
dashmap = "6.2.1"
inventory = "0.3.24"
encoding_rs = "0.8.35"
fastembed = "6.0.2"
moka = { version = "0.12.16", features = ["future"] }
# 优化 1 同步：rusqlite 也改为支持 time
# 注意：tokio-rusqlite 0.7 依赖锁定 rusqlite ^0.37，二者必须配套，不能单独升级 rusqlite
# （libsqlite3-sys 的 links 约束不允许两个 rusqlite 版本共存）
rusqlite = { version = "0.37.0", features = ["bundled", "time"] }
tokio-rusqlite = "0.7.0"
sqlite-vec = "0.1.9"

[workspace]
members = [
    ".",
]

# 测试构建提速：测试二进制约 89MB（含 ort/ONNX），完整调试信息使 MSVC 链接长达 20+ 分钟。
# line-tables-only 保留堆栈回溯所需的行号表，去掉变量级调试信息，链接时间可缩短一个量级。
# 只影响 cargo test / cargo bench；cargo check 与常规 dev 构建不受影响。
[profile.test]
debug = "line-tables-only"

[dev-dependencies]
tempfile = "3.27.0"
