[package]
name = "symbio-plugin-loop"
version = "0.1.14"
description = "Symbio plugin: loop"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-kernel = { path = "../symbio-kernel" }
symbio-core = { path = "../symbio-core" }
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-deploy = { path = "../symbio-deploy" }
symbio-providers = { path = "../symbio-providers" }
# `rc` feature：`PluginFrame::Data` 的载荷是 `Arc<Value>`（见 transport.rs 的说明），
# 而 `Arc<T>: Deserialize` 在 serde 里是 opt-in 的。开启后 `PluginFrame` 才能继续
# `derive(Deserialize)`——Tauri 命令参数与 gateway 的 WS 入帧都依赖它。
# 副作用仅限「反序列化 `Rc/Arc` 不保留共享身份」，本仓从不依赖该身份。
# 内核 crate（封闭语法的共享类型层）：core 与插件都经它拿事件 / 视图 / 声明容器。
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
# 优化 1：从 chrono 迁移到更轻量的 time
time = { workspace = true, features = ["serde", "formatting", "parsing", "macros"] }
glob = { workspace = true }
# 跨平台内容搜索：直接调用 ripgrep 库（替代对 rg/PowerShell/grep 可执行文件的依赖），并遵循 .gitignore
grep = { workspace = true }
notify = { workspace = true }
# 统一资源协议：zip 上传解压（MCP / Skill / Agent 以 zip 为主，文件名=目录名）
# 仅启用 deflate（flate2/miniz_oxide，纯 Rust）：默认 features 会拉入 zstd/lzma 等 C 编译包
zip = { workspace = true, features = ["deflate"] }

# 日志宏（`plugin_info!` / `plugin_warn!` / `plugin_error!` / `plugin_debug!`）在**调用站点**
# 展开，宏体里的 `tracing::warn!` 等按调用方作用域解析 ⇒ 这是本 crate 的真实依赖，不是
# core 的（那几个宏没有用 `$crate` 重导出 tracing）。源码里搜不到 `tracing::` 不代表不需要它。
tracing = { workspace = true }

[dev-dependencies]
# 测试替身（`StubLlmAdapter` / `trivial_actor_spec`）—— 原住 core 的常开出口，
# 拆 crate 后 `#[cfg(test)]` 对下游不可见，故搬 `symbio-testkit`，只以 dev 形态进来。
symbio-testkit = { path = "../symbio-testkit" }
tempfile = { workspace = true }
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { workspace = true, features = ["test-util"] }
