# 编译期装配声明（scripts/facts/assembly.mjs 读取；不是运行期 VDFS 配置）
plugin_id: loop
plugin_comment: 纯机制环：选债、派发、等待、配对、记账、预算与租约、重放
plugin_assembly: sub_agent
plugin_order: 40
# 本插件导出给别的插件命名的跨插件事件名（scripts/facts/events-rs.mjs 读取 →
# crates/symbio-plugin-api/src/events.rs）。格位仍住在 vocab::EVENTS。
# `chat.*` / `user.message` 已随词汇移交进会话簿记的清单，`memory.*` 已随词汇移交进
# 记忆包的清单（本插件不再是它们的 owner）。
shared_events: authz.denied, authz.granted, commitment.asserted, commitment.broken, commitment.opened, commitment.released, task.controlled
# 本插件导出给别的插件按名字读的视图（scripts/facts/views-rs.mjs 读取 →
# crates/symbio-plugin-api/src/view_names.rs）。名字与求值仍住 `control_decl::VIEWS`。
# 纯机制环不导出视图。
