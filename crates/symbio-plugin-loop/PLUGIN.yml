# 编译期装配声明（scripts/facts/assembly.mjs 读取；不是运行期 VDFS 配置）
plugin_id: loop
plugin_comment: 纯机制环：选债、派发、等待、配对、记账、预算与租约、重放
plugin_assembly: sub_agent
plugin_order: 40
# 本插件导出给别的插件命名的跨插件事件名（scripts/facts/events-rs.mjs 读取 →
# crates/symbio-plugin-api/src/events.rs）。格位仍住在 control_decl::EVENTS。
# `memory.calibrated` 不在本行：它随技能观测搬回技能包（D-262），本插件不再写它。
# `memory.consolidated` / `memory.forgotten` 自 D-263 起进本行：写方与读方仍只在本
# 插件（巩固 / 召回投影），但**情景记忆编码包**的同文去重要读这两条名字的活集——
# 两个插件同时消费的名字走清单共享，不由单一写方独占（DE-024 D-204 同一口径）。
shared_events: authz.denied, authz.granted, chat.assistant.fallback, chat.assistant.final, chat.assistant.opening, chat.assistant.progress, chat.assistant.reported, commitment.asserted, commitment.broken, commitment.opened, commitment.released, memory.consolidated, memory.encoded, memory.forgotten, session.config, task.controlled, turn.branch, turn.dispatch, user.message
# 本插件导出给别的插件按名字读的视图（scripts/facts/views-rs.mjs 读取 →
# crates/symbio-plugin-api/src/view_names.rs）。名字与求值仍住 `control_decl::VIEWS`。
# 纯机制环不导出视图。
shared_views: 
