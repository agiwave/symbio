# 编译期装配声明（scripts/facts/assembly.mjs 读取；不是运行期 VDFS 配置）
plugin_id: loop
plugin_comment: 驱动器：一轮的判决 / 工具循环（经地址面被会话触发，随每棵子树分形）
plugin_assembly: sub_agent
plugin_order: 40
# 本插件导出给别的插件命名的跨插件事件名（scripts/facts/events-rs.mjs 读取 →
# crates/symbio-plugin-api/src/events.rs）。格位仍住在 control_decl::EVENTS。
shared_events: artifact.added, authz.denied, chat.assistant.fallback, chat.assistant.final, chat.assistant.opening, chat.assistant.progress, chat.assistant.reported, commitment.asserted, commitment.broken, commitment.opened, commitment.released, memory.calibrated, memory.encoded, task.asserted, task.assigned, task.controlled, task.held, task.opened, task.progress, turn.branch, turn.dispatch, turn.supplemented, user.message

# 授权行（同 session 的口径）：调度者只持 `assign.work`——发放的权威动作是派活，
# 不立任务（`define.work`）、不发言（`reply`）。
principal_scheduler: scheduler/main|assign.work|thread_private
