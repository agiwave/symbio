[package]
name = "symbio-plugin-compact"
version = "0.1.14"
description = "Symbio plugin: compact"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-plugin-api = { path = "../symbio-plugin-api" }
serde_json = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
# 测试要构造带 `PLUGIN_PARENT` 的调用方 ctx（钩子触发面判据：`PreCompact` 由执行体发），
# 那个键只住 kernel 且门面不转出；只以 dev 形态进来，不进生产依赖边。
symbio-kernel = { path = "../symbio-kernel" }
