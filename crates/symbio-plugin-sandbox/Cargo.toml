[package]
name = "symbio-plugin-sandbox"
version = "0.1.14"
description = "Symbio plugin: sandbox（横切沙箱接口的实现方 / 具名沙箱配置管理）"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-providers = { path = "../symbio-providers" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
tracing = { workspace = true }
