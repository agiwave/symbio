[package]
name = "symbio-testkit"
version = "0.1.14"
description = "Symbio testkit: locality fixtures for the five extension points"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-kernel = { path = "../symbio-kernel" }
symbio-core = { path = "../symbio-core" }
symbio-plugin-api = { path = "../symbio-plugin-api" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"
# 优化 1：从 chrono 迁移到更轻量的 time
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { version = "1.53.1", features = ["test-util"] }
