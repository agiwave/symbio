# 编译期装配声明（scripts/facts/assembly.mjs 读取；不是运行期 VDFS 配置）
plugin_id: task
plugin_comment: 任务表：清单声明成事实、独立验证与返工、就绪集调度与调度段
plugin_assembly: sub_agent
plugin_order: 45
# 本插件导出给别的插件命名的跨插件事件名（scripts/facts/events-rs.mjs 读取 →
# crates/symbio-plugin-api/src/events.rs）。格位仍住 decl::EVENTS。
# task.assigned（租约）不在此列：D-281 后无外部消费方，名字随 owner 走（CS-007）。
shared_events: task.asserted, task.held, task.opened, task.progress

# 对外可读的报表都在 `src/decl.rs` 的 `submit_reports!`（D-387）：报表登记就是公开，
# 不存在第二份视图名清单。

# 授权行：调度者只持 `assign.work`——发放的权威动作是派活，
# 不立任务（`define.work`）、不发言（`reply`）。
principal_scheduler: scheduler/main|assign.work|thread_private
