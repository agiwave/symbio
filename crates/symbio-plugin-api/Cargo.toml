[package]
name = "symbio-plugin-api"
version = "0.1.14"
description = "Symbio plugin API: the host surface a plugin may depend on (routes, hooks)"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-core = { path = "../symbio-core" }
# 装配常量（`PLUGIN_ID_*` / `ASSEMBLY_*`）：生成物、零内部依赖。扩展层插件经本 crate
# 取用，manifest 里不再单列 `symbio-deploy`——插件 id 是部署契约，不是插件自己的事。
symbio-deploy = { path = "../symbio-deploy" }
# `rc` feature：`PluginFrame::Data` 的载荷是 `Arc<Value>`（见 transport.rs 的说明），
# 而 `Arc<T>: Deserialize` 在 serde 里是 opt-in 的。开启后 `PluginFrame` 才能继续
# `derive(Deserialize)`——Tauri 命令参数与 gateway 的 WS 入帧都依赖它。
# 副作用仅限「反序列化 `Rc/Arc` 不保留共享身份」，本仓从不依赖该身份。
# 内核 crate（封闭语法的共享类型层）：core 与插件都经它拿事件 / 视图 / 声明容器。
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
tracing = { workspace = true }
# 声明表的链接期收集：与 core 的 `submit_object_creator!` 同一条机制。
inventory = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { workspace = true, features = ["test-util"] }
