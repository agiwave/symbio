[package]
name = "symbio-runtime"
version = "0.1.14"
description = "Symbio runtime: the in-process host, the shared RuntimeHost, session workers and the browser server"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-frontend-assets = { path = "../symbio-frontend-assets" }
symbio-http = { path = "../symbio-http" }
symbio-platform = { path = "../symbio-platform" }
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-providers = { path = "../symbio-providers" }
async-trait = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = "0.10.9"
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
# 主部署驱动入口的链接期登记（`DriveEntryDecl`）。
inventory = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt", "time"] }
