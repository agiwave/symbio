[package]
name = "symbio-plugin-conation"
version = "0.1.14"
description = "Symbio plugin: conation"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-plugin-api = { path = "../symbio-plugin-api" }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
# `plugin_warn!` 在调用站点展开，宏体里的 `tracing::warn!` 按调用方作用域解析。
tracing = { workspace = true }

[dev-dependencies]
symbio-testkit = { path = "../symbio-testkit" }
tokio = { workspace = true, features = ["macros", "rt"] }
