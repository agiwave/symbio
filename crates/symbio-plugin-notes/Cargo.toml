[package]
name = "symbio-plugin-notes"
version = "0.1.0"
description = "Symbio plugin: notes"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-kernel = { path = "../symbio-kernel" }
symbio-core = { path = "../symbio-core" }
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-deploy = { path = "../symbio-deploy" }
# `rc` feature：`PluginFrame::Data` 的载荷是 `Arc<Value>`，而 `Arc<T>: Deserialize`
# 在 serde 里是 opt-in 的（与其余插件同一条理由，见 compose 的说明）。
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# 日志宏在调用站点展开，宏体里的 `tracing::warn!` 按调用方作用域解析 ⇒ 本 crate 的
# 真实依赖（与其余插件同一条理由）。
tracing = { workspace = true }
