[package]
name = "symbio-plugin-agent"
version = "0.1.14"
description = "Symbio plugin: agent"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-kernel = { path = "../symbio-kernel" }
symbio-core = { path = "../symbio-core" }
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-deploy = { path = "../symbio-deploy" }
symbio-providers = { path = "../symbio-providers" }
# `rc` feature：`PluginFrame::Data` 的载荷是 `Arc<Value>`（见 transport.rs 的说明），
# 而 `Arc<T>: Deserialize` 在 serde 里是 opt-in 的。开启后 `PluginFrame` 才能继续
# `derive(Deserialize)`——Tauri 命令参数与 gateway 的 WS 入帧都依赖它。
# 副作用仅限「反序列化 `Rc/Arc` 不保留共享身份」，本仓从不依赖该身份。
# 内核 crate（封闭语法的共享类型层）：core 与插件都经它拿事件 / 视图 / 声明容器。
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
glob = "0.3.4"
# 跨平台内容搜索：直接调用 ripgrep 库（替代对 rg/PowerShell/grep 可执行文件的依赖），并遵循 .gitignore
grep = "0.4.1"
# 优化 2：替换已停止维护的 serde_yaml（serde_yml 也不维护且有漏洞，改用其维护中的 fork）
serde_yaml_ng = "0.10.0"
notify = "8.2.0"
inventory = "0.3.24"
# 统一资源协议：zip 上传解压（MCP / Skill / Agent 以 zip 为主，文件名=目录名）
# 仅启用 deflate（flate2/miniz_oxide，纯 Rust）：默认 features 会拉入 zstd/lzma 等 C 编译包
zip = { version = "2.4.1", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"

# 日志宏（`plugin_info!` / `plugin_warn!` / `plugin_error!` / `plugin_debug!`）在**调用站点**
# 展开，宏体里的 `tracing::warn!` 等按调用方作用域解析 ⇒ 这是本 crate 的真实依赖，不是
# core 的（那几个宏没有用 `$crate` 重导出 tracing）。源码里搜不到 `tracing::` 不代表不需要它。
tracing = "0.1.44"

[dev-dependencies]
# 这 8 条 `host::tests` 是**跨插件的装配用例**：它们要的是「一整棵 composite 子树」，
# 而子树的每个插件各自用一个 `submit_object_creator!` 注册工厂（inventory）。
# crate 化（D-191）之后，`cargo test -p symbio-plugin-agent` 的测试二进制里只有本 crate，
# 别的插件工厂一个都不在 ⇒ `creator_create_object` 返回 None，用例报「拒绝接入」。
# 把宿主门面挂成 dev-dependency：它 `pub use` 全部插件 crate，链接进来就把注册表补齐。
# dev-依赖成环是 Cargo 允许的（`symbio` → 本 crate 是普通依赖，本 crate → `symbio` 只在测试里）。
symbio = { path = "../symbio" }
tempfile = "3.27.0"
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { version = "1.53.1", features = ["test-util"] }
