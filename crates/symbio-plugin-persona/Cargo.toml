[package]
name = "symbio-plugin-persona"
version = "0.1.14"
description = "Symbio plugin: persona"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-plugin-api = { path = "../symbio-plugin-api" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
# `plugin_warn!` 等日志宏是**卫生宏的例外**：它们没有用 `$crate` 重导出 `tracing`，
# 宏体里的 `tracing::warn!` 按调用方作用域解析 ⇒ 这是本 crate 的真实依赖。
# 源码里搜不到 `tracing::` 不代表它不需要。
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
