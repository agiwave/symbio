[package]
name = "symbio-plugin-plugin_manager"
version = "0.1.14"
description = "Symbio plugin: plugin_manager"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-kernel = { path = "../symbio-kernel" }
symbio-core = { path = "../symbio-core" }
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-deploy = { path = "../symbio-deploy" }
symbio-providers = { path = "../symbio-providers" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"

[dev-dependencies]
tempfile = "3.27.0"
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { version = "1.53.1", features = ["test-util"] }
