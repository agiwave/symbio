# 编译期装配声明（scripts/facts/assembly.mjs 读取；不是运行期 VDFS 配置）
plugin_id: model
plugin_comment: 模型服务（子智能体自己的模型；子树会话自行解析）
plugin_assembly: sub_agent
plugin_order: 80
# 跨插件消费的事实名：`tool.requested` 由本执行体写、`plugin-tool` 的债表按名字问；
# `tool.call.requested` 是逐笔债的标记（同一出口按 `calls[]` 落 N 条）。
shared_events: tool.requested, tool.call.requested
