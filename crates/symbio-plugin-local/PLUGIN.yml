# 编译期装配声明（scripts/facts/assembly.mjs 读取；不是运行期 VDFS 配置）
plugin_id: local
plugin_comment: 本地文件
plugin_assembly: sub_agent
plugin_order: 90

# 授权行（同 session 的口径）：工具主体——工具响应的权威动作是**产生产物**。
principal_tool_content_search: local/content_search|produce.artifact|thread_private
# 本插件**工具主体**的命名空间（scripts/facts/tool-namespaces.mjs 读取 →
# crates/symbio-kernel/src/chat/tool_namespaces.gen.rs）。工具名 `<ns>_<tool>` 因此
# 合成为 `<ns>/<tool>`；未声明的插件，其工具一律落 `legacy/<name>`。
tool_namespace: local
