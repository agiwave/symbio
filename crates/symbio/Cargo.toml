[package]
name = "symbio"
version = "0.1.14"
description = "Symbio host: assembly policy, init and the plugin tree facade"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-core = { path = "../symbio-core" }
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-deploy = { path = "../symbio-deploy" }
# 主机装配必须带嵌入臂：语义检索的实现经 `submit_object_creator!` 注册在这里，关掉就等于关掉那条能力（D-254）。
symbio-providers = { path = "../symbio-providers", features = ["embedding"] }
# >>> plugin-links:begin
# 以下依赖行由 `scripts/facts/plugin-links-cargo.mjs` 从 `crates/symbio-plugin-<id>/` 目录投影，请勿手改（加插件 = 建目录 + `PLUGIN.yml`）。
symbio-plugin-agent = { path = "../symbio-plugin-agent" }
symbio-plugin-classify = { path = "../symbio-plugin-classify" }
symbio-plugin-compose = { path = "../symbio-plugin-compose" }
symbio-plugin-composite = { path = "../symbio-plugin-composite" }
symbio-plugin-event_bus = { path = "../symbio-plugin-event_bus" }
symbio-plugin-gateway = { path = "../symbio-plugin-gateway" }
symbio-plugin-heartbeat = { path = "../symbio-plugin-heartbeat" }
symbio-plugin-home = { path = "../symbio-plugin-home" }
symbio-plugin-hook = { path = "../symbio-plugin-hook" }
symbio-plugin-local = { path = "../symbio-plugin-local" }
symbio-plugin-loop = { path = "../symbio-plugin-loop" }
symbio-plugin-mcp = { path = "../symbio-plugin-mcp" }
symbio-plugin-memory = { path = "../symbio-plugin-memory" }
symbio-plugin-model = { path = "../symbio-plugin-model" }
symbio-plugin-notes = { path = "../symbio-plugin-notes" }
symbio-plugin-plugin_manager = { path = "../symbio-plugin-plugin_manager" }
symbio-plugin-session = { path = "../symbio-plugin-session" }
symbio-plugin-setting = { path = "../symbio-plugin-setting" }
symbio-plugin-skill = { path = "../symbio-plugin-skill" }
symbio-plugin-task = { path = "../symbio-plugin-task" }
symbio-plugin-telegram = { path = "../symbio-plugin-telegram" }
symbio-plugin-vdfs = { path = "../symbio-plugin-vdfs" }
symbio-plugin-web = { path = "../symbio-plugin-web" }
# <<< plugin-links:end
inventory = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { workspace = true, features = ["test-util"] }
