[package]
name = "symbio-plugin-tool"
version = "0.1.14"
description = "Symbio plugin: tool（工具世界的 port.tool 提供者）"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-plugin-api = { path = "../symbio-plugin-api" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 测试里工具桩经 `register_tool` 收口注册（与生产同一条写入路径：端口行 + 工具行），
# 收口函数住在收集器 crate。
symbio-providers = { path = "../symbio-providers" }
