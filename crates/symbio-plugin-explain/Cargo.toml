[package]
name = "symbio-plugin-explain"
version = "0.1.14"
description = "Symbio plugin: explain"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-plugin-api = { path = "../symbio-plugin-api" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
# `plugin_warn!` 等日志宏是卫生宏的例外：宏体里的 `tracing::` 按调用方作用域解析。
tracing = { workspace = true }
