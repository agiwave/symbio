[package]
name = "symbio-plugin-gateway"
version = "0.1.14"
description = "Symbio plugin: gateway"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-http = { path = "../symbio-http" }
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-providers = { path = "../symbio-providers" }
# 配置与策略载荷的序列化；WS 帧的 `rc` feature 由共享传输统一声明。
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
# 优化 1：从 chrono 迁移到更轻量的 time
time = { workspace = true, features = ["serde", "formatting", "parsing", "macros"] }
# 跨平台内容搜索：直接调用 ripgrep 库（替代对 rg/PowerShell/grep 可执行文件的依赖），并遵循 .gitignore
grep = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { workspace = true, features = ["test-util"] }
