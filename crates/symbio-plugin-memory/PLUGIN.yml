# 编译期装配声明（scripts/facts/assembly.mjs 读取；不是运行期 VDFS 配置）
plugin_id: memory
plugin_comment: 记忆：智能体自身（分形）+ 工作区（WORKDIR 继承父会话），两作用域同属一个所有者
plugin_assembly: sub_agent
plugin_order: 180
# 本插件导出给别的插件命名的跨插件事件名（scripts/facts/events-rs.mjs 读取 →
# crates/symbio-plugin-api/src/events.rs）。格位仍住在 `decl::EVENTS`。
# 只有 `memory.encoded` 与 `memory.consolidated` 有跨插件生产读者（skill 幂等 / recall；
# session 的召回可见切片按 `memory.consolidated` 判收放）；`memory.forgotten` 除 owner
# 外没有生产读者（CS-007），名字留在 `decl.rs` 的本地常量，不进生成物。
# `memory.recalled` 同样没有跨插件读方，不进本行。
shared_events: memory.encoded, memory.consolidated
# 本插件不登记 `shared_views`：`memory.live` 的公开动作是报表登记（`D-387`）——
# `recall::decl` 的 `submit_reports!` 以 `slot = memory` 交出，读方遍历 `reports()`，
# 不再经生成清单 `view_names.rs`。视图本身仍是 owner 的 `ViewDecl`，名字只有一份。
