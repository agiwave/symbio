# 编译期装配声明（scripts/facts/assembly.mjs 读取；不是运行期 VDFS 配置）
plugin_id: memory
plugin_comment: 记忆：智能体自身（分形）+ 工作区（WORKDIR 继承父会话），两作用域同属一个所有者
plugin_assembly: sub_agent
plugin_order: 180
# 本插件导出给别的插件按名字读的视图（scripts/facts/views-rs.mjs 读取 →
# crates/symbio-plugin-api/src/view_names.rs）。名字与求值仍住 `recall::decl::VIEWS`。
# `memory.live` = 活集折叠（encoded ∪ consolidated − forgotten）：巩固留控制面
# （D-268），它按这个名字读同一副折叠——一副折叠两个读者，不是两份实现。
shared_views: memory.live
