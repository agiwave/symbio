[package]
name = "symbio-providers"
version = "0.1.14"
description = "Symbio providers: facade over the pluggable service implementations"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-core = { path = "../symbio-core" }
symbio-provider-collectors = { path = "../symbio-provider-collectors" }
symbio-provider-embedding = { path = "../symbio-provider-embedding" }
symbio-provider-memory = { path = "../symbio-provider-memory" }
symbio-provider-vdfs_service = { path = "../symbio-provider-vdfs_service" }
# 统一资源协议：zip 上传解压（MCP / Skill / Agent 以 zip 为主，文件名=目录名）
# 仅启用 deflate（flate2/miniz_oxide，纯 Rust）：默认 features 会拉入 zstd/lzma 等 C 编译包
zip = { version = "2.4.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { version = "1.53.1", features = ["test-util"] }
