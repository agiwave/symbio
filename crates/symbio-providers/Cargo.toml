[package]
name = "symbio-providers"
version = "0.1.14"
description = "Symbio providers: service implementations owned by the assembly root"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-platform = { path = "../symbio-platform" }
symbio-plugin-api = { path = "../symbio-plugin-api" }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
time = { workspace = true, features = ["serde", "formatting", "parsing", "macros"] }
grep = { workspace = true }
# 统一资源协议：zip 上传解压；仅 deflate，避免 zstd/lzma 的 C 编译包。
zip = { workspace = true, features = ["deflate"] }
base64 = { workspace = true }
tempfile = { workspace = true }
# 日志宏在调用站点展开，故 tracing 是本 crate 的真实依赖。
tracing = { workspace = true }

# `embedding` 是可选臂：它带来 ort / tokenizers 与原生运行时下载，
# 默认不装；装配根与需要降级原因的调用方显式开。
regex = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, features = ["fancy-regex"], optional = true }

[features]
default = []
embedding = ["dep:regex", "dep:ort", "dep:tokenizers"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
