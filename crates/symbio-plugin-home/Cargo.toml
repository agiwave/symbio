[package]
name = "symbio-plugin-home"
version = "0.1.14"
description = "Symbio plugin: home"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-kernel = { path = "../symbio-kernel" }
symbio-core = { path = "../symbio-core" }
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-deploy = { path = "../symbio-deploy" }
symbio-providers = { path = "../symbio-providers" }
# `rc` feature：`PluginFrame::Data` 的载荷是 `Arc<Value>`（见 transport.rs 的说明），
# 而 `Arc<T>: Deserialize` 在 serde 里是 opt-in 的。开启后 `PluginFrame` 才能继续
# `derive(Deserialize)`——Tauri 命令参数与 gateway 的 WS 入帧都依赖它。
# 副作用仅限「反序列化 `Rc/Arc` 不保留共享身份」，本仓从不依赖该身份。
# 内核 crate（封闭语法的共享类型层）：core 与插件都经它拿事件 / 视图 / 声明容器。
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"
dirs = "6.0.0"
shellexpand = "3.1.2"
tracing = "0.1.44"
# 优化 2：替换已停止维护的 serde_yaml（serde_yml 也不维护且有漏洞，改用其维护中的 fork）
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"

[dev-dependencies]
tempfile = "3.27.0"
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { version = "1.53.1", features = ["test-util"] }
