[package]
name = "symbio-plugin-mcp"
version = "0.1.14"
description = "Symbio plugin: mcp"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-providers = { path = "../symbio-providers" }
# `rc` feature：`PluginFrame::Data` 的载荷是 `Arc<Value>`（见 transport.rs 的说明），
# 而 `Arc<T>: Deserialize` 在 serde 里是 opt-in 的。开启后 `PluginFrame` 才能继续
# `derive(Deserialize)`——Tauri 命令参数与 gateway 的 WS 入帧都依赖它。
# 副作用仅限「反序列化 `Rc/Arc` 不保留共享身份」，本仓从不依赖该身份。
# 内核 crate（封闭语法的共享类型层）：core 与插件都经它拿事件 / 视图 / 声明容器。
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
# 优化 1：从 chrono 迁移到更轻量的 time
time = { workspace = true, features = ["serde", "formatting", "parsing", "macros"] }
# TLS 后端 = 平台原生栈：Windows → SChannel，macOS → Security.framework，Linux → 系统 OpenSSL。
# Windows/macOS 上因此**零 C 编译**（schannel 是纯 Rust FFI 绑定，无源码、无 build.rs）。
# 代价是引入平台分支：Linux 侧需要系统 OpenSSL（libssl-dev），否则要改开 native-tls-vendored。
# 换来的是整条 rustls 链退出构建 —— aws-lc-sys 是 414 个 .c + 178 个 .cc + 941 个汇编、
# 145k 行 C，且**无条件**依赖 cmake，曾是依赖树里最脆的一环。
# 默认特性在根 `[workspace.dependencies]` 关闭；使用方必须显式补回 `default` 里的非 TLS 能力：
#   charset（响应体编码判定）· http2（LLM API 基本都走 h2）· system-proxy（读系统代理）。
reqwest = { workspace = true, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "system-proxy",
    "native-tls",
] }
url = { workspace = true }
# 跨平台内容搜索：直接调用 ripgrep 库（替代对 rg/PowerShell/grep 可执行文件的依赖），并遵循 .gitignore
grep = { workspace = true }
tracing = { workspace = true }
encoding_rs = { workspace = true }
# 统一资源协议：zip 上传解压（MCP / Skill / Agent 以 zip 为主，文件名=目录名）
# 仅启用 deflate（flate2/miniz_oxide，纯 Rust）：默认 features 会拉入 zstd/lzma 等 C 编译包
zip = { workspace = true, features = ["deflate"] }

[dev-dependencies]
tempfile = { workspace = true }
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { workspace = true, features = ["test-util"] }
