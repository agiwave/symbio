[package]
name = "symbio-provider-memory"
version = "0.1.14"
description = "Symbio provider: memory implementation"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-sdk = { path = "../symbio-sdk" }
symbio-contract = { path = "../symbio-contract" }
symbio-kernel = { path = "../symbio-kernel" }
# 优化 1：从 chrono 迁移到更轻量的 time
time = { workspace = true, features = ["serde", "formatting", "parsing", "macros"] }
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { workspace = true, features = ["test-util"] }
# 测试用：实现一个最小 VdfsProvider（钉住 Vdfs 后端 NotFound → 空串的语义）
async-trait = { workspace = true }
