[package]
name = "symbio-provider-memory"
version = "0.1.14"
description = "Symbio provider: memory implementation"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-kernel = { path = "../symbio-kernel" }
symbio-core = { path = "../symbio-core" }
# 优化 1：从 chrono 迁移到更轻量的 time
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tempfile = "3.27.0"

[dev-dependencies]
tempfile = "3.27.0"
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { version = "1.53.1", features = ["test-util"] }
