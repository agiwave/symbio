[package]
name = "symbio-core"
version = "0.1.14"
description = "Symbio core: mechanism layer (plugin protocol, services, governance)"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-kernel = { path = "../symbio-kernel" }
# 插件可依赖的机制层（D-258）：日志 / 时钟 / 事件总线 / 地址装配 / 构造器登记 / 文本工具
# 的实现都住这里。core 依赖它是**用**它，不是重复定义它——域目录只做转发。
symbio-sdk = { path = "../symbio-sdk" }
# `rc` feature：`PluginFrame::Data` 的载荷是 `Arc<Value>`（见 transport.rs 的说明），
# 而 `Arc<T>: Deserialize` 在 serde 里是 opt-in 的。开启后 `PluginFrame` 才能继续
# `derive(Deserialize)`——Tauri 命令参数与 gateway 的 WS 入帧都依赖它。
# 副作用仅限「反序列化 `Rc/Arc` 不保留共享身份」，本仓从不依赖该身份。
# 内核 crate（封闭语法的共享类型层）：core 与插件都经它拿事件 / 视图 / 声明容器。
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
# 优化 1：从 chrono 迁移到更轻量的 time
time = { workspace = true, features = ["serde", "formatting", "parsing", "macros"] }
glob = { workspace = true }
# 跨平台内容搜索：直接调用 ripgrep 库（替代对 rg/PowerShell/grep 可执行文件的依赖），并遵循 .gitignore
grep = { workspace = true }
ignore = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# 优化 2：替换已停止维护的 serde_yaml（serde_yml 也不维护且有漏洞，改用其维护中的 fork）
serde_yaml_ng = { workspace = true }
notify = { workspace = true }
dashmap = { workspace = true }
inventory = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { workspace = true, features = ["test-util"] }
