[package]
name = "symbio-plugin-composite"
version = "0.1.14"
description = "Symbio plugin: composite"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-providers = { path = "../symbio-providers" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
dirs = { workspace = true }
# 优化 1：从 chrono 迁移到更轻量的 time
time = { workspace = true, features = ["serde", "formatting", "parsing", "macros"] }
inventory = { workspace = true }

# 日志宏（`plugin_info!` / `plugin_warn!` / `plugin_error!` / `plugin_debug!`）在**调用站点**
# 展开，宏体里的 `tracing::warn!` 等按调用方作用域解析 ⇒ 这是本 crate 的真实依赖，不是
# core 的（那几个宏没有用 `$crate` 重导出 tracing）。源码里搜不到 `tracing::` 不代表不需要它。
tracing = { workspace = true }

[dev-dependencies]
# 与 `symbio-plugin-agent` 同一处境：这几条用例要的是**一整棵装配树**，而每个插件的
# 工厂注册（`inventory`）只存在于它自己的 crate 里。crate 化（D-191）之后单 crate 的
# 测试二进制里没有兄弟插件的注册 ⇒ 装配返回 None。宿主门面把全部插件 `pub use` 进来，
# 挂成 dev-dependency 即补齐注册表（dev 成环 Cargo 允许）。
symbio = { path = "../symbio" }
# 容器测试要扮演一次「轮次派发」才能验证路由转发，那批符号属于**控制面**的容器概念
# （`TurnSpec` / `TurnDispatch` / …），不在扩展层门面的白名单里（D-253）——测试面直接
# 取 core，与 EX-008 对 `*.test.rs` 不判是同一条纪律。
symbio-core = { path = "../symbio-core" }
tempfile = { workspace = true }
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { workspace = true, features = ["test-util"] }
