[package]
name = "symbio-plugin-glossary"
version = "0.1.0"
description = "Symbio plugin: project glossary"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-providers = { path = "../symbio-providers" }
# `rc` feature：`PluginFrame::Data` 的载荷是 `Arc<Value>`（与其余插件同一条理由）。
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# 日志宏在调用站点展开，宏体里的 `tracing::warn!` 按调用方作用域解析 ⇒ 本 crate 的
# 真实依赖（与其余插件同一条理由）。
tracing = { workspace = true }
