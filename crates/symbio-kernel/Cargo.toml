[package]
name = "symbio-kernel"
version = "0.1.14"
description = "Symbio kernel: the closed syntax shared by the core and its plugins"
authors = ["Symbio Team"]
license = "MIT"
repository = ""
edition = "2021"
# 与 symbio / cli 的 MSRV 保持一致（见 crates/symbio/Cargo.toml 的说明）。
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
