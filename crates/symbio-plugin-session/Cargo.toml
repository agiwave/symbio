[package]
name = "symbio-plugin-session"
version = "0.1.14"
description = "Symbio plugin: session"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-platform = { path = "../symbio-platform" }
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-providers = { path = "../symbio-providers" }
# `rc` feature：`PluginFrame::Data` 的载荷是 `Arc<Value>`（见 transport.rs 的说明），
# 而 `Arc<T>: Deserialize` 在 serde 里是 opt-in 的。开启后 `PluginFrame` 才能继续
# `derive(Deserialize)`——Tauri 命令参数与 gateway 的 WS 入帧都依赖它。
# 副作用仅限「反序列化 `Rc/Arc` 不保留共享身份」，本仓从不依赖该身份。
# 内核 crate（封闭语法的共享类型层）：core 与插件都经它拿事件 / 视图 / 声明容器。
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
async-trait = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
# 优化 1：从 chrono 迁移到更轻量的 time
time = { workspace = true, features = ["serde", "formatting", "parsing", "macros"] }
url = { workspace = true }
glob = { workspace = true }
# 跨平台内容搜索：直接调用 ripgrep 库（替代对 rg/PowerShell/grep 可执行文件的依赖），并遵循 .gitignore
grep = { workspace = true }
tracing = { workspace = true }
notify = { workspace = true }
dashmap = { workspace = true }
# 统一资源协议：zip 上传解压（MCP / Skill / Agent 以 zip 为主，文件名=目录名）
# 仅启用 deflate（flate2/miniz_oxide，纯 Rust）：默认 features 会拉入 zstd/lzma 等 C 编译包
zip = { workspace = true, features = ["deflate"] }
tempfile = { workspace = true }

[dev-dependencies]
# 随会话投影迁入的用例仍使用平台按 owner 声明生成的事件拼写；仅测试构建开启。
symbio-platform = { path = "../symbio-platform", features = ["test-fixtures"] }
# 测试替身经门面的显式 test-fixtures feature 开启，默认生产构建不编译。
symbio-plugin-api = { path = "../symbio-plugin-api", features = ["test-fixtures"] }
tempfile = { workspace = true }
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { workspace = true, features = ["test-util"] }
