[package]
name = "symbio-provider-collectors"
version = "0.1.14"
description = "Symbio provider: collectors implementation"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-kernel = { path = "../symbio-kernel" }
symbio-core = { path = "../symbio-core" }
symbio-sdk = { path = "../symbio-sdk" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }

# 日志宏（`plugin_info!` / `plugin_warn!` / `plugin_error!` / `plugin_debug!`）在**调用站点**
# 展开，宏体里的 `tracing::warn!` 等按调用方作用域解析 ⇒ 这是本 crate 的真实依赖，不是
# core 的（那几个宏没有用 `$crate` 重导出 tracing）。源码里搜不到 `tracing::` 不代表不需要它。
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { workspace = true, features = ["test-util"] }
