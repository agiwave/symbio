[package]
name = "symbio-plugin-event_bus"
version = "0.1.14"
description = "Symbio plugin: event_bus"
authors = ["Symbio Team"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[dependencies]
symbio-kernel = { path = "../symbio-kernel" }
symbio-core = { path = "../symbio-core" }
symbio-plugin-api = { path = "../symbio-plugin-api" }
symbio-deploy = { path = "../symbio-deploy" }
symbio-providers = { path = "../symbio-providers" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
ignore = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# 测试用：tokio 时间控制（start_paused / advance）
tokio = { workspace = true, features = ["test-util"] }
